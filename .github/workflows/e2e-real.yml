name: 真机 E2E（手工触发 · Playwright + 真 key）

# 设计稿：docs/research/设计-真机E2E用例全集-2026-10-23.md §0.1 / §5.1
#   - **只手工触发**（workflow_dispatch），不挂 push / pull_request；
#   - 只跑 Chromium，不做浏览器兼容矩阵；
#   - 两套模式：
#       ① stub：桩上游（scripts/ci/stub-upstream.mjs，零密钥、确定性）
#          —— L-107 后按**域分步**跑：主栈切片 + VL/NFEZUI/GF2/MDXY/MDO/KQC×3/解锁缩阈值，
#             每步用自己的 config（端口段 / Redis DB / 桩 / 后端参数全隔离），产物目录互不覆盖（L-108）；
#       ② real：真模型（secret/vars 从 GitHub Environment `e2e-real` 注入）
#   - 真模型用例默认采样 10（C 级概率口径，§0.3），由 E2E_REAL_SAMPLING 传入；
#   - 失败时上传 trace / screenshot / 控制台日志；仓库内**零 key 字面量**。
on:
  workflow_dispatch:
    inputs:
      suite:
        description: '跑哪套（stub / real / both）'
        type: choice
        options: [stub, real, both]
        default: stub
      sample:
        description: '真模型采样次数（C 级概率口径，默认 10）'
        type: string
        default: '10'

permissions:
  contents: read

jobs:
  e2e-stub:
    name: UI 层 E2E（桩上游 · Chromium）
    if: ${{ inputs.suite == 'stub' || inputs.suite == 'both' }}
    runs-on: ubuntu-latest
    # 9 步 = 主栈切片 + 8 个域专用档（每步各起一套 JVM/vite）；35 分钟不够全量
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.2.16
        ports: ['6379:6379']
        command: --maxmemory-policy noeviction
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      E2E_MODE: stub
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21（temurin）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 安装 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: 打包后端（classes + 依赖 classpath，harness 不复用 jar）
        working-directory: backend
        run: |
          mvn -B -DskipTests package
          mvn -B dependency:build-classpath -Dmdep.outputFile=target/e2e-classpath.txt

      - name: 安装前端依赖（严格按锁文件）
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: 解析 Playwright 版本（浏览器缓存键）
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: 安装 Chromium（仅此一款）
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 前端单独跑 vitest（门禁仍在 ci.yml；这里只确认 e2e 目录未污染 vitest 采集面）
      - name: vitest 采集面自证（e2e 不参与）
        working-directory: frontend
        run: npx vitest run --reporter=dot

      # 主栈切片（00–10、11a/11b、17-unlock）：主 config 已用 testIgnore 排除域专用 spec
      # （L-107），所以这里不会再撞 12 系 / 13 系 / 14 系 / 15 / 16-kqc 系 / 17b / 11c-gf2。
      # 各域步一律 `if: !cancelled()`：某一域红不遮其它域的证据（GitHub 默认 success() 链会整串跳过）。
      - name: 真机 E2E（桩模式 · 主栈切片）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --grep @stub

      # VL 域（12a/12b）：自带三件套（18930/18999/19001 + DB 12）且强制本域基址，
      # 故用独立 config（E2E_EXTERNAL=1 ⇒ 不再起 183xx 那套）。
      - name: 真机 E2E（桩模式 · VL 域 · 可视可操作/工具全量面）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config playwright.vl.config.ts

      # NFEZUI 域（13 系）：独占端口段 191xx + Redis DB 13/14 + 本域桩（config 在 e2e/ 内）。
      - name: 真机 E2E（桩模式 · NFEZUI 域 · 13 系）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config e2e/playwright.nfezui.config.ts

      # GF2 域（同会话两轮生成式表单）单开一棒：本域换桩（e2e/support/gf2-upstream.mjs，
      # 官方桩的两条收敛契约不允许"同会话第二轮再发卡"）⇒ 官方桩路由表是共享契约、不为其扩表。
      # config 自带端口段 225xx + Redis DB 3（与上面主 config 的 183xx / DB 5-6 完全错开），
      # 起停仍由同一套 support/harness.ts 负责。
      - name: 真机 E2E（桩模式 · GF2 域 · 同会话两轮表单）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config e2e/playwright.gf2.config.ts

      # MDXY 域（14 系）：本域桩 + KEK。KEK 只在本步内生成（base64 32B，测试用），不落仓库、不进日志。
      - name: 真机 E2E（桩模式 · MDXY 域 · 14 系）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          AI_SECRET_KEK="$(head -c 32 /dev/urandom | base64 -w 0)"
          export AI_SECRET_KEK
          npx playwright test --config playwright.mdxy.config.ts

      # MDO 域（15）：双 JVM 同 Redis DB，验证跨实例扇出/决策/读台账。
      - name: 真机 E2E（桩模式 · MDO 域 · 多实例/降级/并发）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config playwright.mdo.config.ts

      # KQC 域（16-kqc 系）三档：主档 / 降级档（K-06、C-02 专用后端参数）/ 压缩档（小分母）。
      - name: 真机 E2E（桩模式 · KQC 域 · 主档）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config playwright.kqc.config.ts

      - name: 真机 E2E（桩模式 · KQC 域 · 降级档 K-06/C-02）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config playwright.kqc-special.config.ts

      - name: 真机 E2E（桩模式 · KQC 域 · 压缩档 C-08/C-10/C-13/C-14）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config playwright.kqc-compact.config.ts

      # 解锁域缩阈值档（17b）：整棒缩小工具超时/总预算，与主栈切片里的 17-unlock 拆开。
      - name: 真机 E2E（桩模式 · 解锁域 · 缩阈值档）
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config playwright.unlock-budget.config.ts

      - name: 归档失败证据（trace / screenshot / harness 日志）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-stub-evidence
          # 排除自起实例的依赖解包缓存（可能 ~100MB，属可重生物）
          path: |
            frontend/test-results
            !frontend/test-results/.e2e-run/jar
          retention-days: 7
          if-no-files-found: warn

  e2e-real:
    name: 真模型 E2E 冒烟（真 key · Chromium）
    if: ${{ inputs.suite == 'real' || inputs.suite == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 密钥与端点只来自 Environment：仓库与 workflow 文本零 key 字面量。
    environment: e2e-real
    services:
      redis:
        image: redis:7.2.16
        ports: ['6379:6379']
        command: --maxmemory-policy noeviction
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      E2E_MODE: real
      E2E_REAL_SAMPLING: ${{ inputs.sample }}
      AI_API_KEY: ${{ secrets.E2E_AI_API_KEY }}
      AI_BASE_URL: ${{ vars.E2E_AI_BASE_URL }}
      AI_MODEL: ${{ vars.E2E_AI_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21（temurin）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 安装 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: 打包后端（classes + 依赖 classpath）
        working-directory: backend
        run: |
          mvn -B -DskipTests package
          mvn -B dependency:build-classpath -Dmdep.outputFile=target/e2e-classpath.txt

      - name: 安装前端依赖（严格按锁文件）
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: 解析 Playwright 版本（浏览器缓存键）
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: 安装 Chromium（仅此一款）
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 先证明注入面存在（只断言非空，不打印任何密钥值）
      - name: 注入面自检（只判非空）
        run: |
          test -n "$AI_API_KEY" || { echo "::error::Environment e2e-real 未提供 secret E2E_AI_API_KEY"; exit 1; }
          echo "AI_BASE_URL=${AI_BASE_URL:-<unset>}"
          echo "AI_MODEL=${AI_MODEL:-<unset>}"

      - name: 真机 E2E（真模型 · 自起后端 + 前端）
        working-directory: frontend
        run: npx playwright test --grep @real

      - name: 归档失败证据（trace / screenshot / harness 日志）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-real-evidence
          path: |
            frontend/test-results
            !frontend/test-results/.e2e-run/jar
          retention-days: 7
          if-no-files-found: warn
