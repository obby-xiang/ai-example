server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:h2:file:./data/ai_config_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key-here}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.2
          max-tokens: 4096

# 自定义AI配置（用于自定义调用）
app:
  ai:
    base-url: https://api.deepseek.com
    chat-path: /chat/completions
    model: deepseek-v4-flash
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key-here}
    # 改造 H2：LLM 调用读超时（秒）。长上下文流式生成可能 60s+ 不出 token，默认 30s 会误杀，需 120s+
    read-timeout-seconds: 180
    # 改造 H1：可重试错误（429/5xx/网络超时）的最大重试次数，指数退避 1s×2^n + jitter，尊重 Retry-After
    max-retries: 3
  agent:
    # 改造 C1：WAITING_TOOL 交互超时时间（分钟）。超时后端拒绝回灌并置 EXPIRED，
    # 前端 pending 卡片倒计时置灰「已过期，请重新发起」（AG-UI 超时安全默认：拒绝）
    waiting-tool-ttl-minutes: 10

logging:
  level:
    org.springframework.ai: INFO
    com.example.ai: DEBUG
    org.hibernate.SQL: WARN
