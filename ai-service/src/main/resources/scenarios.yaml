# 场景状态图 —— 业界 LangGraph 状态机模式（响应经验 100029435）
# 设计原则：
#   1. 每个场景是一个状态图，节点是步骤，边是跳转
#   2. 每个节点声明自己的工具集（progressive disclosure），AI 永远只看到当前步骤的工具
#   3. 状态机维护全局连贯性，AI 不决定路由
#   4. 跨步骤数据通过 AgentState.stepArtifacts 传递（Phase 2 实施）
#
# 工具集命名约定：
#   - navigate_step 出现在所有步骤（路由工具）
#   - get_workspace_state 出现在所有步骤（按需查询当前状态）
#   - 业务工具按步骤语义出现

scenarios:
  EXPORT:
    name: 导出配置
    description: 选择配置项，设置查询条件，导出数据
    steps:
      - id: SELECT_SCENARIO
        next: SELECT_DEFS
        description: 选择业务场景
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: SELECT_DEFS
        next: QUERY_COND
        description: 选择要导出的配置项
        tools: [navigate_step, get_workspace_state, list_config_defs, get_config_def, select_definitions, collect_user_input]
      - id: QUERY_COND
        next: RESULT
        description: 设置查询条件
        tools: [navigate_step, get_workspace_state, list_config_defs, get_config_def, table_batch_set_field, table_replace_values, collect_user_input]
      - id: RESULT
        next: END
        description: 查看导出结果
        tools: [navigate_step, get_workspace_state, run_flow, confirm_complete, collect_user_input]

  IMPORT:
    name: 导入配置
    description: 上传文件，预检查，复核，发布
    steps:
      - id: SELECT_SCENARIO
        next: VIEW_DEFS
        description: 选择业务场景
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: VIEW_DEFS
        next: PRECHECK
        description: 查看导入的配置项
        tools: [navigate_step, get_workspace_state, list_config_defs, get_config_def, collect_user_input]
      - id: PRECHECK
        next: REVIEW
        description: 预检查数据
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: REVIEW
        next: PUBLISH
        description: 复核确认
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: PUBLISH
        next: END
        description: 发布导入
        tools: [navigate_step, get_workspace_state, run_flow, confirm_complete, collect_user_input]

  ADD:
    name: 新增配置
    description: 定义新配置项，预检查，复核，发布
    steps:
      - id: SELECT_SCENARIO
        next: VIEW_DEFS
        description: 选择业务场景
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: VIEW_DEFS
        next: PRECHECK
        description: 编辑新增的配置项
        tools: [navigate_step, get_workspace_state, list_config_defs, get_config_def, table_batch_set_field, table_replace_values, collect_user_input]
      - id: PRECHECK
        next: REVIEW
        description: 预检查数据
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: REVIEW
        next: PUBLISH
        description: 复核确认
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: PUBLISH
        next: END
        description: 发布新增
        tools: [navigate_step, get_workspace_state, run_flow, confirm_complete, collect_user_input]

  MODIFY:
    name: 修改配置
    description: 修改现有配置项数据，预检查，复核，发布
    steps:
      - id: SELECT_SCENARIO
        next: VIEW_DEFS
        description: 选择业务场景
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: VIEW_DEFS
        next: PRECHECK
        description: 编辑配置项数据
        tools: [navigate_step, get_workspace_state, list_config_defs, get_config_def, table_batch_set_field, table_delete_rows, table_replace_values, collect_user_input]
      - id: PRECHECK
        next: REVIEW
        description: 预检查数据
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: REVIEW
        next: PUBLISH
        description: 复核确认
        tools: [navigate_step, get_workspace_state, collect_user_input]
      - id: PUBLISH
        next: END
        description: 发布修改
        tools: [navigate_step, get_workspace_state, run_flow, confirm_complete, collect_user_input]
