<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>配置助手 · 交互演示（欢迎区 / 通用确认卡 / 表单 / 收起展开）</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 仅放 Tailwind 工具类表达不了的：keyframes、滚动条、呼吸光晕绑定 */
  html,body{height:100%}
  .breath-halo{animation:haloPulse 1.8s ease-in-out infinite}
  @keyframes haloPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
    45%{box-shadow:0 0 0 7px rgba(37,99,235,.10)}
    65%{box-shadow:0 0 0 3px rgba(37,99,235,.16)}
  }
  .dots i{display:block;width:7px;height:7px;border-radius:50%;background:#2563eb;animation:dotBreathe 1.15s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes dotBreathe{0%,100%{opacity:.28;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
  .chat-scroll{scrollbar-width:thin;scrollbar-color:rgba(144,147,153,.4) transparent}
  .chat-scroll::-webkit-scrollbar{width:6px}
  .chat-scroll::-webkit-scrollbar-thumb{background:rgba(144,147,153,.4);border-radius:999px}
  @media (prefers-reduced-motion:reduce){
    .breath-halo{animation:none;box-shadow:0 0 0 5px rgba(37,99,235,.12)}
    .dots i{animation:none;opacity:.8}
  }
</style>
</head>
<body class="m-0 bg-[#f1f2f4] text-[#1f2328] font-sans text-[13px] leading-[1.6] antialiased [&_button:focus-visible]:outline-none [&_button:focus-visible]:ring-2 [&_button:focus-visible]:ring-[#2563eb]/40">

<!-- ───────── 演示场景栏（Demo 工具，不属于产品界面） ───────── -->
<header class="sticky top-0 z-40 bg-[#1f2328] text-white">
  <div class="mx-auto flex max-w-[1680px] flex-wrap items-center gap-[10px] px-[18px] py-[9px]">
    <span class="rounded-[5px] bg-white/15 px-[6px] py-[1px] text-[10.5px] tracking-[.08em]">DEMO</span>
    <span class="text-[12.5px] text-white/75">演示场景（仅 Demo 导航，不属于产品界面）</span>
    <nav id="sceneNav" class="flex flex-1 flex-wrap gap-[6px]" aria-label="演示场景">
      <button type="button" data-scenario="welcome" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="true">1 新对话欢迎</button>
      <button type="button" data-scenario="generating" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="false">2 回复中 / 工具执行</button>
      <button type="button" data-scenario="gate-create" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="false">3 创建导出确认</button>
      <button type="button" data-scenario="gate-start" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="false">4 启动导出确认</button>
      <button type="button" data-scenario="gate-publish" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="false">5 发布配置确认</button>
      <button type="button" data-scenario="form" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="false">6 条件表单</button>
      <button type="button" data-scenario="collapsed-generating" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="false">7 收起后光晕</button>
      <button type="button" data-scenario="outcomes" class="rounded-[7px] border border-white/20 px-[9px] py-[3px] text-[12px] text-white/80 transition-colors hover:border-white/45 hover:text-white aria-pressed:border-[#2563eb] aria-pressed:bg-[#2563eb] aria-pressed:text-white" aria-pressed="false">8 批准 / 拒绝 / 停止对照</button>
    </nav>
  </div>
</header>

<!-- ───────── 产品界面（对齐 App.vue + AiPanel.vue 的真实形态） ───────── -->
<div class="flex h-[calc(100vh-42px)] flex-col">
  <header class="flex items-center justify-between border-b border-[#e5e7eb] bg-white px-[16px] py-[8px]">
    <div class="flex items-center gap-[16px]">
      <span class="text-[18px] font-medium leading-[1.6]">配置管理平台</span>
      <ul class="flex items-center gap-[4px]">
        <li class="flex h-[40px] items-center border-b-2 border-[#2563eb] px-[12px] text-[14px] text-[#2563eb]">任务中心</li>
        <li class="flex h-[40px] items-center border-b-2 border-transparent px-[12px] text-[14px] text-[#303133]">配置定义</li>
        <li class="flex h-[40px] items-center border-b-2 border-transparent px-[12px] text-[14px] text-[#303133]">数据浏览</li>
        <li class="flex h-[40px] items-center border-b-2 border-transparent px-[12px] text-[14px] text-[#303133]">AI 设置</li>
        <li class="flex h-[40px] items-center border-b-2 border-transparent px-[12px] text-[14px] text-[#303133]">AI 反馈</li>
      </ul>
    </div>
    <div class="flex items-center gap-[12px]">
      <button type="button" class="border-0 bg-transparent p-0 text-[13px] text-[#409eff]">EN</button>
      <button type="button" id="headToggle" class="border-0 bg-transparent p-0 text-[13px] text-[#409eff]">隐藏 AI 栏</button>
    </div>
  </header>

  <main class="flex min-h-0 flex-1">
    <section class="min-w-0 flex-1 overflow-auto p-[24px]">
      <div class="rounded-[8px] border border-[#ebeef5] bg-white px-[18px] py-[16px]">
        <h2 class="m-0 mb-[4px] text-[15px] font-semibold text-[#303133]">任务中心</h2>
        <p class="m-0 mb-[14px] text-[12px] text-[#8b949e]">导出配置 / 导入配置 任务管理 · 手动刷新 · 数据截至 10:24:00</p>
        <table class="w-full border-collapse text-[12.5px]">
          <thead>
            <tr class="bg-[#fafafa] text-[#57606a]">
              <th class="border-b border-[#ebeef5] px-[10px] py-[8px] text-left font-medium">任务</th>
              <th class="border-b border-[#ebeef5] px-[10px] py-[8px] text-left font-medium">类型</th>
              <th class="border-b border-[#ebeef5] px-[10px] py-[8px] text-left font-medium">状态</th>
              <th class="border-b border-[#ebeef5] px-[10px] py-[8px] text-left font-medium">当前步骤</th>
            </tr>
          </thead>
          <tbody class="text-[#303133]">
            <tr><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">#12 导出CNY货币字典</td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">导出配置</td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]"><span class="inline-block rounded-[4px] border border-[#bfe3cd] bg-[#edf7f0] px-[6px] text-[11px] text-[#1a7f45]">已完成</span></td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">导出执行</td></tr>
            <tr><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">#11 导出货币字典</td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">导出配置</td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]"><span class="inline-block rounded-[4px] border border-[#bfe3cd] bg-[#edf7f0] px-[6px] text-[11px] text-[#1a7f45]">已完成</span></td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">导出执行</td></tr>
            <tr><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">#10 导入项目参数</td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">导入配置</td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]"><span class="inline-block rounded-[4px] border border-[#bfe3cd] bg-[#edf7f0] px-[6px] text-[11px] text-[#1a7f45]">已完成</span></td><td class="border-b border-[#ebeef5] px-[10px] py-[9px]">导入执行</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <aside id="aside" class="relative flex-none overflow-hidden border-l border-[#e4e7ed] bg-white transition-[width] duration-200 w-[420px]">
      <!-- 48px 收起条 -->
      <button id="collapsedStrip" type="button" aria-label="展开 AI 栏" class="hidden h-full w-full flex-col items-center gap-[8px] bg-transparent pt-[16px] text-[#57606a]" style="writing-mode:horizontal-tb">
        <span id="stripMark" class="grid h-[30px] w-[30px] place-items-center rounded-[8px] bg-[#eff4ff] text-[#2563eb]">
          <svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.6 4.4 4.4 1.6-4.4 1.6L12 15.5l-1.6-4.4L6 9.5l4.4-1.6L12 3.5Z"></path><path d="M18.4 15.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"></path></svg>
        </span>
        <span class="text-[13px]" style="writing-mode:vertical-rl;letter-spacing:.5px">配置助手</span>
      </button>

      <div id="panel" class="flex h-full min-w-0 flex-col">
        <!-- 头部 -->
        <div class="flex items-center gap-[10px] border-b border-[#ebeef5] px-[12px] py-[10px]">
          <span class="grid h-[30px] w-[30px] flex-none place-items-center rounded-[8px] bg-[#eff4ff] text-[#2563eb]" aria-hidden="true">
            <svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.6 4.4 4.4 1.6-4.4 1.6L12 15.5l-1.6-4.4L6 9.5l4.4-1.6L12 3.5Z"></path><path d="M18.4 15.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"></path></svg>
          </span>
          <div class="min-w-0 flex-1 text-[14px] font-semibold text-[#303133]">配置助手</div>
          <button id="newChat" type="button" title="新建对话" class="rounded-[6px] border-0 bg-transparent px-[8px] py-[5px] text-[12px] text-[#409eff] hover:bg-[#eff4ff]">新建对话</button>
          <button id="collapseBtn" type="button" title="收起" aria-label="收起 AI 栏" class="relative grid h-[26px] w-[26px] place-items-center rounded-[6px] border-0 bg-transparent text-[#57606a] hover:bg-[#f6f7f9] hover:text-[#1f2328]">
            <svg class="h-[15px] w-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
          </button>
        </div>

        <div id="chatScroll" class="chat-scroll flex-1 overflow-y-auto overflow-x-hidden p-[12px]" role="log" aria-label="对话记录">
          <div id="welcome"></div>
          <div id="messages"></div>
        </div>

        <!-- 输入区 -->
        <div class="border-t border-[#eef0f3] bg-white px-[14px] py-[10px]">
          <div class="rounded-[12px] border border-[#e3e6ea] bg-white transition-[border-color,box-shadow] duration-150 focus-within:border-[#2563eb] focus-within:ring-2 focus-within:ring-[#2563eb]/40">
            <textarea id="input" rows="1" maxlength="8000" placeholder="输入消息，Enter 发送，Shift+Enter 换行" class="block max-h-[101px] min-h-[40px] w-full resize-none overflow-y-auto rounded-t-[12px] border-0 bg-transparent px-[11px] pb-[7px] pt-[11px] text-[13px] leading-[1.6] text-[#1f2328] outline-none placeholder:text-[#8b949e]" style="field-sizing:content"></textarea>
            <div class="relative flex items-center gap-[6px] px-[9px] pb-[7px]">
              <span class="flex-1"></span>
              <span class="mr-[2px] h-[16px] w-[16px] flex-none rounded-full border-2 border-[#e3e6ea]" title="上下文占用" aria-hidden="true"></span>
              <button id="sendBtn" type="button" aria-label="发送" class="ml-auto flex h-[28px] w-[28px] flex-none items-center justify-center rounded-full border-0 bg-[#2563eb] text-[13px] leading-none text-white transition-all duration-150 hover:brightness-[1.08] disabled:cursor-default disabled:bg-[#8b949e]">↑</button>
              <button id="stopBtn" type="button" aria-label="停止" hidden class="ml-auto flex h-[28px] w-[28px] flex-none items-center justify-center rounded-full border-0 bg-[#1f2328] transition-all duration-150 hover:brightness-[1.15]"><span class="block h-[9px] w-[9px] rounded-[2px] bg-white" aria-hidden="true"></span></button>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
/**
 * 演示状态与函数（可回落映射）
 *   state.messages / state.streaming / state.collapsed  ⇄ AiPanel store（messages / loading+suspended / expanded）
 *   send() → streamInto()                                ⇄ send → start/message_start/delta/done
 *   openGate() / decide()                                ⇄ confirm_request / confirm_decision
 *   submitForm() / cancelForm()                          ⇄ generative_form 回灌 / FRONTEND_CANCELLED
 *   stopTurn()                                           ⇄ ai.stop()（段 stopped）
 *   setCollapsed()                                       ⇄ ai.toggleExpand() + App.vue aside 宽度
 */
(function () {
  'use strict'

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches

  var el = {
    aside: document.getElementById('aside'),
    panel: document.getElementById('panel'),
    strip: document.getElementById('collapsedStrip'),
    stripMark: document.getElementById('stripMark'),
    collapseBtn: document.getElementById('collapseBtn'),
    headToggle: document.getElementById('headToggle'),
    newChat: document.getElementById('newChat'),
    scroll: document.getElementById('chatScroll'),
    welcome: document.getElementById('welcome'),
    messages: document.getElementById('messages'),
    input: document.getElementById('input'),
    send: document.getElementById('sendBtn'),
    stop: document.getElementById('stopBtn'),
    nav: document.getElementById('sceneNav')
  }

  var state = { scenario: 'welcome', messages: [], streaming: false, collapsed: false, seq: 0, timer: null }

  var GATES = {
    create: {
      title: '待你确认：创建导出 任务「导出CNY货币字典」',
      summary: '创建任务',
      fields: [['操作', '创建导出任务'], ['任务标题', '导出CNY货币字典'], ['影响面', '将创建 1 个导出任务（创建≠执行，不启动作业）']],
      ok: '任务已创建（任务 #12），配置项与查询条件已写入向导。',
      no: '已取消创建导出任务，未产生任何任务。'
    },
    start: {
      title: '待你确认：导出 任务 #12『导出CNY货币字典』',
      summary: '启动导出作业',
      fields: [['操作', '启动导出作业'], ['任务', '#12 导出CNY货币字典'], ['范围', '全部货币记录（未设置筛选条件）']],
      ok: '已启动导出作业（作业 #12），进度可在任务中心查看。',
      no: '已取消启动导出作业，未产生任何作业。'
    },
    publish: {
      title: '待你确认：发布 任务 #10『导入项目参数』',
      summary: '启动发布作业',
      fields: [['操作', '启动发布作业'], ['发布范围', '项目参数 · 2 个环境'], ['影响面', '将覆盖范围内 1,248 行数据']],
      ack: '确认启动发布作业：若本次为整体替换，范围内旧数据将被删除，执行后无法恢复',
      ok: '已启动发布作业（作业 #10），执行结果可在任务中心查看。',
      no: '已拒绝启动发布作业，正式库未做任何变更。'
    }
  }

  var GENERATING_TEXT = '我先确认一下导出范围。货币字典属于 GLOBAL 级配置，包含编码、名称与小数位三个字段；本次按全部货币记录导出，不额外叠加区域条件。正在读取配置定义与字段类型，并核对「code 等于 CNY」的筛选条件是否可写入任务；同时检查任务当前步骤与已有导出结果，避免重复创建同名任务。'
    + '如果已有同名任务，我会先说明它的步骤与结果，再由您决定是否新建。随后会把创建任务的影响面（配置项数量、是否启动作业）整理给您确认。'

  // ── 基础工具 ──────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
    })
  }
  function clock() {
    var d = new Date()
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
  }
  function uid(prefix) {
    state.seq += 1
    return prefix + '-' + state.seq
  }
  function findMessage(id) {
    return state.messages.filter(function (m) { return m.id === id })[0] || null
  }
  function findCard(messageId, cardId) {
    var m = findMessage(messageId)
    if (!m) return null
    return (m.cards || []).filter(function (c) { return c.id === cardId })[0] || null
  }

  // ── 状态同步：停止按钮 ⇄ 收起图标光晕（同一条件，无额外状态源） ─────────────
  function syncChrome() {
    el.send.hidden = state.streaming
    el.stop.hidden = !state.streaming
    el.send.disabled = state.streaming || el.input.value.trim() === ''
    el.collapseBtn.classList.toggle('breath-halo', state.streaming)
    el.stripMark.classList.toggle('breath-halo', state.streaming)
  }

  // ── 视图片段（结构对齐 AiPanel.vue / FormRenderer.vue） ────────────────────
  function welcomeHtml() {
    return '' +
      '<div class="m-[12px] rounded-[10px] border border-[#e3e6ea] bg-white px-[14px] py-[16px]" data-testid="empty-state">' +
        '<div class="mb-[8px] flex items-center gap-[9px]">' +
          '<span class="grid h-[30px] w-[30px] flex-none place-items-center rounded-[8px] bg-[#eff4ff] text-[#2563eb]">' +
            '<svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.6 4.4 4.4 1.6-4.4 1.6L12 15.5l-1.6-4.4L6 9.5l4.4-1.6L12 3.5Z"></path><path d="M18.4 15.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"></path></svg>' +
          '</span>' +
          '<div><div class="text-[13.2px] font-[650]">您好，我是配置助手</div><div class="text-[11.5px] text-[#8b949e]">配置管理平台的 AI 工作台</div></div>' +
        '</div>' +
        '<div class="text-[12.4px] leading-[1.8] text-[#57606a]">我可以帮您查询配置项与字段、查看任务，<br>打开导出结果在线编辑器、下载导出文件，<br>并启动导出/预检查/导入/发布作业。</div>' +
        '<div class="mt-[10px] flex flex-wrap gap-[6px]">' +
          '<button type="button" data-act="chip" data-text="导出cny货币字典（新建任务）" data-testid="suggestion-chip" class="rounded-full border border-[#e3e6ea] bg-white px-[11px] py-[4px] text-[12.2px] text-[#57606a] transition-colors hover:border-[#cddcff] hover:text-[#2563eb]">导出cny货币字典</button>' +
          '<button type="button" data-act="chip" data-text="查看任务 #12 的导出结果" data-testid="suggestion-chip" class="rounded-full border border-[#e3e6ea] bg-white px-[11px] py-[4px] text-[12.2px] text-[#57606a] transition-colors hover:border-[#cddcff] hover:text-[#2563eb]">查看导出结果</button>' +
          '<button type="button" data-act="chip" data-text="配置发布的流程规范是什么？" data-testid="suggestion-chip" class="rounded-full border border-[#e3e6ea] bg-white px-[11px] py-[4px] text-[12.2px] text-[#57606a] transition-colors hover:border-[#cddcff] hover:text-[#2563eb]">配置发布流程规范</button>' +
        '</div>' +
        '<div class="mt-[10px] text-[11.4px] leading-[1.7] text-[#8b949e]">对话只留本页签浏览器镜像与服务端 24 小时滑动记忆窗口，刷新可恢复。</div>' +
      '</div>'
  }

  function statusChip(status) {
    if (status === 'pending') return '<span data-testid="card-status" class="flex-none rounded-[5px] border border-[#cddcff] bg-[#eff4ff] px-[5px] text-[9.5px] leading-[1.7] text-[#2563eb]">待确认</span>'
    if (status === 'success') return '<span data-testid="card-status" class="flex-none rounded-[5px] border border-[#bfe3cd] bg-[#edf7f0] px-[5px] text-[9.5px] leading-[1.7] text-[#1a7f45]">已成功</span>'
    if (status === 'rejected') return '<span data-testid="card-status" class="flex-none rounded-[5px] border border-[#e3e6ea] bg-[#fdf1ef] px-[5px] text-[9.5px] leading-[1.7] text-[#c0392b]">已拒绝</span>'
    return '<span data-testid="card-status" class="flex-none rounded-[5px] border border-[#e3e6ea] bg-[#f6f7f9] px-[5px] text-[9.5px] leading-[1.7] text-[#57606a]">已取消</span>'
  }

  function rowsHtml(fields, testid) {
    return '<div class="mx-[11px] mt-[9px] rounded-[8px] border border-[#eef0f3] bg-white px-[10px] py-[2px]" ' + (testid ? 'data-testid="' + testid + '"' : '') + '>' +
      fields.map(function (pair) {
        return '<div class="flex gap-[10px] border-b border-[#eef0f3] py-[7px] text-[13px] leading-[1.5] last:border-b-0">' +
          '<span class="max-w-[40%] flex-[0_1_auto] overflow-hidden text-ellipsis whitespace-nowrap text-[12.4px] text-[#8b949e]">' + esc(pair[0]) + '</span>' +
          '<span class="min-w-0 flex-1 break-words">' + esc(pair[1]) + '</span></div>'
      }).join('') + '</div>'
  }

  function gateHtml(message, card) {
    var open = card.open ? '1' : '0'
    var head = '<button type="button" data-act="toggle-card" data-msg="' + message.id + '" data-card="' + card.id + '" aria-expanded="' + (card.open ? 'true' : 'false') + '"' + (card.status === 'pending' ? ' disabled' : '') + ' class="flex min-h-[36px] w-full items-center gap-[6px] border-0 bg-transparent px-[10px] py-[8px] text-left transition-colors hover:bg-[#f6f7f9] disabled:cursor-default">' +
      '<span class="flex w-[24px] flex-none items-center justify-center text-[#57606a]"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#57606a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></span>' +
      '<span class="flex min-w-0 flex-1 items-center gap-[6px]"><span class="min-w-0 overflow-hidden text-ellipsis whitespace-nowrap text-[12px] font-[650] leading-[1.7] text-[#1f2328]">' + esc(card.title) + '</span><span class="min-w-0 overflow-hidden text-ellipsis whitespace-nowrap text-[11.5px] leading-[1.6] text-[#57606a]">' + esc(card.summary) + '</span></span>' +
      statusChip(card.status) +
      (card.status === 'pending' ? '' : '<span class="ml-auto text-[12px] text-[#57606a]">›</span>') +
      '</button>'

    var body = ''
    if (card.status === 'pending') {
      body = rowsHtml(card.fields, 'gate-rows')
      if (card.ack) {
        body += '<div class="flex px-[11px] pt-[10px]"><label class="flex cursor-pointer items-start gap-[6px] text-[12.2px] leading-[1.5] text-[#1f2328]">' +
          '<input type="checkbox" data-act="ack" data-msg="' + message.id + '" data-card="' + card.id + '" class="mt-[2px] flex-none cursor-pointer accent-[#2563eb]"' + (card.acked ? ' checked' : '') + '>' +
          '<span class="min-w-0 break-words">' + esc(card.ack) + '</span></label></div>'
      }
      body += '<div class="flex flex-wrap items-center gap-[9px] px-[11px] pt-[11px]" data-testid="gate-actions">' +
        '<span class="' + (card.ack && !card.acked ? '' : 'hidden ') + 'text-[12.2px] text-[#b45309]">请先勾选上方确认项</span>' +
        '<span class="ml-auto flex flex-none items-center gap-[8px] whitespace-nowrap">' +
          '<button type="button" data-act="reject" data-msg="' + message.id + '" data-card="' + card.id + '" class="min-w-[56px] rounded-[8px] border border-[#e3e6ea] bg-white px-[13px] py-[5px] text-[12.6px] text-[#57606a] transition-all hover:border-[#8b949e] hover:text-[#1f2328]">拒绝</button>' +
          '<button type="button" data-act="approve" data-msg="' + message.id + '" data-card="' + card.id + '"' + (card.ack && !card.acked ? ' disabled' : '') + ' class="min-w-[72px] rounded-[8px] border border-transparent bg-[#2563eb] px-[13px] py-[5px] text-[12.6px] font-semibold text-white transition-all hover:brightness-[1.08] disabled:bg-[#8b949e] disabled:font-normal">批准</button>' +
        '</span></div>'
    } else {
      body = '<div class="mx-[11px] mt-[9px] whitespace-pre-wrap rounded-[8px] border border-[#eef0f3] bg-[#f6f7f9] px-[10px] py-[7px] text-[11.9px] leading-[1.6] text-[#57606a]">' + esc(card.receipt) + '</div>'
    }
    return '<div class="mb-[8px] mt-[6px] overflow-hidden rounded-[10px] border border-[#e3e6ea] bg-white" data-open="' + open + '">' + head +
      '<div class="pb-[11px] ' + (card.open ? '' : 'hidden') + '">' + body + '</div></div>'
  }

  function toolHtml(card) {
    return '<div class="mb-[14px] mt-[6px] overflow-hidden rounded-[10px] border border-[#e3e6ea] bg-white">' +
      '<div class="flex min-h-[36px] items-center gap-[6px] px-[10px] py-[8px]">' +
        '<span class="flex w-[24px] flex-none items-center justify-center text-[#57606a]"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#57606a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></span>' +
        '<span class="flex min-w-0 flex-1 items-center gap-[6px]"><span class="min-w-0 overflow-hidden text-ellipsis whitespace-nowrap font-mono text-[12px] font-[650] leading-[1.7] text-[#1f2328]">' + esc(card.title) + '</span><span class="min-w-0 overflow-hidden text-ellipsis whitespace-nowrap text-[11.5px] leading-[1.6] text-[#57606a]">' + esc(card.summary) + '</span></span>' +
        '<span class="flex-none rounded-[5px] border border-[#bfe3cd] bg-[#edf7f0] px-[5px] text-[9.5px] leading-[1.7] text-[#1a7f45]">已成功</span>' +
      '</div>' +
      '<div class="pb-[11px]">' + rowsHtml(card.fields) + '</div></div>'
  }

  function formHtml(message, card) {
    var status = card.status === 'pending'
      ? '<span data-testid="card-status" class="ml-auto flex-none rounded-[5px] border border-[#cddcff] bg-[#eff4ff] px-[5px] text-[9.5px] leading-[1.7] text-[#2563eb]">待填写</span>'
      : card.status === 'submitted'
        ? '<span data-testid="card-status" class="ml-auto flex-none rounded-[5px] border border-[#bfe3cd] bg-[#edf7f0] px-[5px] text-[9.5px] leading-[1.7] text-[#1a7f45]">已成功</span>'
        : '<span data-testid="card-status" class="ml-auto flex-none rounded-[5px] border border-[#e3e6ea] bg-[#f6f7f9] px-[5px] text-[9.5px] leading-[1.7] text-[#57606a]">已取消</span>'

    var body = card.status === 'pending'
      ? '<div class="p-[11px]" data-testid="gf-form">' +
          '<label class="mb-[4px] block text-[12.2px] text-[#57606a]" for="gf-input-' + card.id + '">筛选条件<span class="text-[#c0392b]" aria-hidden="true"> *</span></label>' +
          '<input id="gf-input-' + card.id + '" data-act="form-input" data-msg="' + message.id + '" data-card="' + card.id + '" type="text" data-testid="gf-field" value="' + esc(card.value) + '" placeholder="例如：code EQ CNY" class="w-full rounded-[8px] border border-[#e3e6ea] bg-white px-[9px] py-[6px] text-[13px] leading-normal text-[#1f2328] outline-none transition-colors focus:border-[#2563eb]">' +
          (card.error ? '<span class="mt-[6px] block rounded-[6px] border border-[#f0d5d0] bg-[#fdf1ef] px-[8px] py-[5px] text-[11.8px] leading-[1.5] text-[#c0392b]">' + esc(card.error) + '</span>' : '') +
          '<div class="mt-[10px] flex flex-wrap items-center justify-end gap-[8px] border-t border-[#eef0f3] pt-[10px]">' +
            '<button type="button" data-act="form-cancel" data-msg="' + message.id + '" data-card="' + card.id + '" class="min-w-[56px] rounded-[8px] border border-[#e3e6ea] bg-white px-[13px] py-[5px] text-[12.6px] text-[#57606a] hover:border-[#8b949e] hover:text-[#1f2328]">取消</button>' +
            '<button type="button" data-act="form-submit" data-msg="' + message.id + '" data-card="' + card.id + '" class="min-w-[56px] rounded-[8px] border border-transparent bg-[#2563eb] px-[13px] py-[5px] text-[12.6px] font-semibold text-white hover:brightness-[1.08]">提交</button>' +
          '</div></div>'
      : '<div class="p-[11px]"><div class="whitespace-pre-wrap rounded-[8px] border border-[#eef0f3] bg-[#f6f7f9] px-[10px] py-[7px] text-[11.9px] leading-[1.6] text-[#57606a]">' + esc(card.receipt) + '</div></div>'

    return '<div class="mb-[8px] mt-[6px] overflow-hidden rounded-[10px] border border-[#e3e6ea] bg-white">' +
      '<div class="flex items-center gap-[7px] border-b border-[#eef0f3] bg-[#f6f7f9] px-[11px] py-[9px] text-[12.8px] font-[650]">' +
        '<span class="flex-none text-[11px] text-[#8b949e]" aria-hidden="true">▤</span>' +
        '<span class="min-w-0 overflow-hidden text-ellipsis whitespace-nowrap">' + esc(card.title) + '</span>' + status +
      '</div>' + body + '</div>'
  }

  function messageHtml(message) {
    if (message.role === 'user') {
      return '<div class="mb-[18px] flex flex-col items-end">' +
        '<div data-testid="msg-bubble" class="max-w-[86%] whitespace-pre-wrap break-words rounded-[12px] border border-[#eef0f3] bg-[#f6f7f9] px-[10px] py-[8px] text-[13.5px] leading-[1.7]">' + esc(message.text) + '</div>' +
        '<div class="mt-[6px] flex flex-row-reverse items-center gap-[8px] text-[12px] text-[#8b949e]"><span>' + clock() + '</span></div></div>'
    }
    var cards = (message.cards || []).map(function (card) {
      if (card.kind === 'gate') return gateHtml(message, card)
      if (card.kind === 'tool') return toolHtml(card)
      if (card.kind === 'form') return formHtml(message, card)
      return ''
    }).join('')
    var meta = message.streaming
      ? '<span class="dots inline-flex items-center gap-[4px]" aria-hidden="true"><i></i><i></i><i></i></span>'
      : message.stopped
        ? '<span class="inline-flex items-center gap-[4px] rounded-[6px] border border-[#e3e6ea] bg-[#f6f7f9] px-[6px] py-[1px] text-[10.5px] leading-[1.6] text-[#57606a]"><span class="block h-[6px] w-[6px] rounded-[1px] bg-[#8b949e]"></span>已停止</span>'
        : '<span>' + clock() + '</span>'
    return '<div class="mb-[18px]">' +
      '<div class="px-[10px] text-[13.8px] leading-[1.7] [overflow-wrap:anywhere]"><div data-testid="msg-bubble" class="whitespace-pre-wrap">' + esc(message.text || '') + '</div>' + cards + '</div>' +
      '<div class="mt-[12px] flex items-center gap-[8px] text-[12px] text-[#8b949e]">' + meta + '</div></div>'
  }

  function render() {
    el.welcome.innerHTML = state.messages.length ? '' : welcomeHtml()
    el.messages.innerHTML = state.messages.map(messageHtml).join('')
    syncChrome()
    el.scroll.scrollTop = el.scroll.scrollHeight
  }

  // ── 交互 ─────────────────────────────────────────────────────────────────
  function pushUser(text) {
    state.messages.push({ id: uid('u'), role: 'user', text: text, cards: [] })
  }
  function pushAssistant(text, opts) {
    var message = { id: uid('a'), role: 'assistant', text: text || '', cards: (opts && opts.cards) || [], streaming: !!(opts && opts.streaming), stopped: false }
    state.messages.push(message)
    return message
  }
  function openGate(message, gate) {
    var card = { id: uid('c'), kind: 'gate', status: 'pending', open: true, acked: false, gate: gate, title: gate.title, summary: gate.summary, fields: gate.fields, ack: gate.ack || '', receipt: '' }
    message.cards.push(card)
    render()
  }

  function streamInto(message, fullText, done) {
    if (reduceMotion) {
      message.text = fullText
      message.streaming = false
      state.streaming = false
      if (done) done()
      render()
      return
    }
    state.streaming = true
    el.input.value = ''
    render()
    var i = 0
    state.timer = window.setInterval(function () {
      i = Math.min(fullText.length, i + 1)
      message.text = fullText.slice(0, i)
      render()
      if (i >= fullText.length) {
        window.clearInterval(state.timer)
        state.timer = null
        message.streaming = false
        state.streaming = false
        if (done) done()
        render()
      }
    }, 26)
  }

  function stopTurn() {
    if (!state.streaming) return
    if (state.timer !== null) { window.clearInterval(state.timer); state.timer = null }
    state.streaming = false
    var last = state.messages[state.messages.length - 1]
    if (last && last.role === 'assistant') {
      last.streaming = false
      last.stopped = true
      if (!last.text) last.text = '（已停止）'
    }
    render()
  }

  function decide(messageId, cardId, approved) {
    var message = findMessage(messageId)
    var card = findCard(messageId, cardId)
    if (!card || card.status !== 'pending') return
    if (approved && card.ack && !card.acked) return
    card.status = approved ? 'success' : 'rejected'
    card.open = false
    card.receipt = approved ? card.gate.ok : card.gate.no
    render()
    pushAssistant(approved ? card.gate.ok : card.gate.no)
    render()
  }

  function send() {
    var text = el.input.value.trim()
    if (!text || state.streaming) return
    pushUser(text)
    var message = pushAssistant('', { streaming: true })
    el.input.value = ''
    render()
    streamInto(message, GENERATING_TEXT, null)
  }

  function newChat() {
    if (state.timer !== null) { window.clearInterval(state.timer); state.timer = null }
    state.streaming = false
    state.messages = []
    el.input.value = ''
    selectScenario('welcome', false)
  }

  function setCollapsed(collapsed) {
    state.collapsed = collapsed
    el.aside.classList.toggle('w-[420px]', !collapsed)
    el.aside.classList.toggle('w-[48px]', collapsed)
    el.panel.classList.toggle('hidden', collapsed)
    el.strip.classList.toggle('hidden', !collapsed)
    el.headToggle.textContent = collapsed ? '显示 AI 栏' : '隐藏 AI 栏'
    if (collapsed) el.strip.focus(); else el.collapseBtn.focus()
  }

  // ── 场景编排 ─────────────────────────────────────────────────────────────
  function reset() {
    if (state.timer !== null) { window.clearInterval(state.timer); state.timer = null }
    state.streaming = false
    state.messages = []
    el.input.value = ''
  }

  var SCENES = {
    'welcome': function () {
      reset()
      setCollapsed(false)
      render()
    },
    'generating': function () {
      reset()
      setCollapsed(false)
      pushUser('导出cny货币字典（新建任务）')
      var message = pushAssistant('', { streaming: true })
      message.cards.push({ kind: 'tool', title: '列出配置定义', summary: '读取配置定义与字段', fields: [['结果', '已找到 15 个配置定义']] })
      render()
      streamInto(message, GENERATING_TEXT, null)
    },
    'gate-create': function () {
      reset()
      setCollapsed(false)
      pushUser('导出cny货币字典（新建任务）')
      var message = pushAssistant('已确认「货币字典」对应配置项，并写入导出条件（code 等于 CNY）。')
      render()
      openGate(message, GATES.create)
    },
    'gate-start': function () {
      reset()
      setCollapsed(false)
      pushUser('导出货币字典（新建任务）')
      var message = pushAssistant('任务已创建，配置项与查询条件已写入向导，当前在「导出执行」步骤。')
      render()
      openGate(message, GATES.start)
    },
    'gate-publish': function () {
      reset()
      setCollapsed(false)
      pushUser('把这次导入发布到正式库')
      var message = pushAssistant('导入暂存区数据已通过预检查，下面需要您确认发布。')
      render()
      openGate(message, GATES.publish)
    },
    'form': function () {
      reset()
      setCollapsed(false)
      pushUser('导出货币字典（新建任务）')
      var message = pushAssistant('任务已创建，请补充本次导出的筛选条件。')
      message.cards.push({ id: uid('c'), kind: 'form', status: 'pending', title: '筛选条件（可选）', value: '', error: '', receipt: '' })
      render()
    },
    'collapsed-generating': function () {
      reset()
      pushUser('导出cny货币字典（新建任务）')
      var message = pushAssistant('', { streaming: true })
      message.cards.push({ kind: 'tool', title: '列出配置定义', summary: '读取配置定义与字段', fields: [['结果', '已找到 15 个配置定义']] })
      setCollapsed(true)
      render()
      streamInto(message, GENERATING_TEXT, null)
    },
    'outcomes': function () {
      reset()
      setCollapsed(false)
      pushUser('导出cny货币字典，并检查发布')
      var m1 = pushAssistant('任务已创建，配置项与查询条件已写入向导。')
      m1.cards.push({ id: uid('c'), kind: 'gate', status: 'success', open: false, title: '待你确认：导出 任务 #12『导出CNY货币字典』', summary: '启动导出作业', fields: [], receipt: GATES.start.ok })
      var m2 = pushAssistant('发布前检查已完成，暂存区数据准备就绪。')
      m2.cards.push({ id: uid('c'), kind: 'gate', status: 'rejected', open: false, title: '待你确认：发布 任务 #10『导入项目参数』', summary: '启动发布作业', fields: [], receipt: GATES.publish.no })
      var m3 = pushAssistant('我正在整理导出文件的字段说明，已读取配置定义与字段类型，接下来')
      m3.stopped = true
      var m4 = pushAssistant('还有一项导出任务需要您确认：')
      render()
      openGate(m4, GATES.create)
    }
  }

  function selectScenario(name, focus) {
    if (!SCENES[name]) return
    state.scenario = name
    Array.prototype.forEach.call(el.nav.querySelectorAll('[data-scenario]'), function (btn) {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-scenario') === name ? 'true' : 'false')
    })
    SCENES[name]()
    if (focus) {
      var active = el.nav.querySelector('[data-scenario="' + name + '"]')
      if (active) active.focus()
    }
  }

  // ── 事件（统一委托，便于回落 Vue 的 @click/@change） ─────────────────────
  el.nav.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-scenario]')
    if (btn) selectScenario(btn.getAttribute('data-scenario'), true)
  })
  el.messages.addEventListener('click', function (event) {
    var target = event.target.closest('[data-act]')
    if (!target) return
    var act = target.getAttribute('data-act')
    var msgId = target.getAttribute('data-msg')
    var cardId = target.getAttribute('data-card')
    if (act === 'approve') decide(msgId, cardId, true)
    else if (act === 'reject') decide(msgId, cardId, false)
    else if (act === 'toggle-card') {
      var card = findCard(msgId, cardId)
      if (card && card.status !== 'pending') { card.open = !card.open; render() }
    } else if (act === 'form-cancel') {
      var fc = findCard(msgId, cardId)
      if (fc && fc.status === 'pending') { fc.status = 'cancelled'; fc.receipt = '已取消，填写内容不作记录。'; render(); pushAssistant('已取消填写。'); render() }
    } else if (act === 'form-submit') {
      var fs = findCard(msgId, cardId)
      if (fs && fs.status === 'pending') {
        if (!String(fs.value || '').trim()) { fs.error = '请填写筛选条件后再提交'; render(); return }
        fs.status = 'submitted'; fs.receipt = '筛选条件已提交。'; fs.error = ''
        render(); pushAssistant('已收到筛选条件，继续为您处理。'); render()
      }
    }
  })
  el.messages.addEventListener('input', function (event) {
    var target = event.target.closest('[data-act="form-input"]')
    if (!target) return
    var card = findCard(target.getAttribute('data-msg'), target.getAttribute('data-card'))
    if (card) card.value = target.value
  })
  el.messages.addEventListener('change', function (event) {
    var target = event.target.closest('[data-act="ack"]')
    if (!target) return
    var card = findCard(target.getAttribute('data-msg'), target.getAttribute('data-card'))
    if (card) { card.acked = target.checked; render() }
  })
  el.input.addEventListener('input', syncChrome)
  el.input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault()
      send()
    }
  })
  el.send.addEventListener('click', send)
  el.stop.addEventListener('click', stopTurn)
  el.newChat.addEventListener('click', newChat)
  el.collapseBtn.addEventListener('click', function () { setCollapsed(true) })
  el.strip.addEventListener('click', function () { setCollapsed(false) })
  el.headToggle.addEventListener('click', function () { setCollapsed(!state.collapsed) })

  // 初始场景
  selectScenario('welcome', false)
})()
</script>
</body>
</html>
