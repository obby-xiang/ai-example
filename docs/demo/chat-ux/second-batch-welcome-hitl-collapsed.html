<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>配置助手 · 欢迎区 / HITL / 收起展开</title>
<!--
  静态演示：结构与尺寸/配色/边框/字体/图标全部取自当前项目
  - frontend/src/components/AiPanel/AiPanel.vue（头部 16-35、空态 261-296、输入区 1164-1226、
    门卡 4098-4150 / 713-775、状态徽标 4219-4246、建议 chip 4576、收起条 2-9）
  - frontend/src/App.vue（48px 收起 / 420px 展开、左边框 #e4e7ed、宽度过渡 200ms，105-120、38-40）
  无任何外链依赖；批准/拒绝/停止/新建对话/收起展开均为真实交互。
-->
<style>
  :root{
    --ink:#1f2328; --ink-2:#303133; --muted:#57606a; --muted-2:#8b949e;
    --line:#e3e6ea; --line-2:#eef0f3; --line-3:#ebeef5; --line-4:#e4e7ed;
    --blue:#2563eb; --blue-soft:#eff4ff; --blue-line:#cddcff;
    --bg-soft:#f6f7f9; --ok:#1a7f45; --ok-bg:#edf7f0; --ok-line:#bfe3cd;
    --danger:#c0392b; --danger-bg:#fdf1ef; --warn:#b45309;
    --panel:420px; --collapsed:48px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);background:#f5f7fa;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.6;
  }
  button{font:inherit;cursor:pointer}
  button:disabled{cursor:default;opacity:.6}
  :where(button,textarea):focus-visible{outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.35);border-radius:8px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ── 应用外壳（App.vue:4-67） ── */
  .shell{height:100%;display:flex;flex-direction:column}
  .app-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
  .app-head .left{display:flex;align-items:center;gap:16px}
  .app-title{font-size:18px;font-weight:500;line-height:1.6}
  .app-nav{display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0}
  .app-nav li{padding:0 12px;height:40px;display:flex;align-items:center;color:#303133;border-bottom:2px solid transparent;font-size:14px}
  .app-nav li.on{color:var(--blue);border-bottom-color:var(--blue)}
  .head-actions{display:flex;align-items:center;gap:12px}
  .link-btn{border:0;background:transparent;color:#409eff;padding:0;font-size:13px}
  .app-main{flex:1;display:flex;min-height:0}

  /* 左侧业务区（只作背景，用真实配色：任务中心表格） */
  .workspace{flex:1;min-width:0;min-height:0;overflow:auto;padding:24px}
  .ws-card{background:#fff;border:1px solid #ebeef5;border-radius:8px;padding:16px 18px}
  .ws-title{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 4px}
  .ws-sub{font-size:12px;color:var(--muted-2);margin:0 0 14px}
  .ws-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .ws-table th{color:var(--muted);font-weight:500;text-align:left;background:#fafafa;padding:8px 10px;border-bottom:1px solid var(--line-3)}
  .ws-table td{padding:9px 10px;border-bottom:1px solid var(--line-3);color:var(--ink-2)}
  .tag{display:inline-block;font-size:11px;line-height:1.6;padding:0 6px;border-radius:4px;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok)}
  .tag.run{border-color:#fde68a;background:#fffbeb;color:var(--warn)}

  /* ── AI 栏（App.vue:38-40 + 105-120：48 ⇄ 420，宽度 200ms） ── */
  .ai-aside{position:relative;flex:none;width:var(--panel);border-left:1px solid var(--line-4);background:#fff;overflow:hidden;transition:width .2s}
  .ai-aside.collapsed{width:var(--collapsed)}
  .panel{height:100%;display:flex;flex-direction:column;min-width:0}
  .panel[hidden]{display:none}

  /* 收起态：48px 竖排条（AiPanel.vue:2-9） */
  .collapsed-strip{height:100%;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:8px;cursor:pointer;color:var(--muted);border:0;background:transparent;width:100%}
  .brand-mark{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:8px;background:var(--blue-soft);color:var(--blue)}
  .brand-mark svg{width:17px;height:17px}
  .vertical{writing-mode:vertical-rl;font-size:13px;letter-spacing:1px}

  /* 头部（AiPanel.vue:16-35） */
  .panel-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-3)}
  .panel-title{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink-2)}
  .text-btn{border:0;background:transparent;color:#409eff;font-size:12px;padding:5px 8px;border-radius:6px}
  .text-btn:hover{background:var(--blue-soft)}
  .icon-btn{position:relative;display:grid;place-items:center;width:26px;height:26px;flex:none;border:0;border-radius:6px;background:transparent;color:var(--muted)}
  .icon-btn:hover{background:var(--bg-soft);color:var(--ink)}
  .icon-btn svg{width:14px;height:14px}

  /* 收起钮的柔和光晕呼吸：仅在“停止按钮显示”时挂 .breathing（停止消失即移除） */
  .icon-btn.breathing{color:var(--blue);animation:halo 1.8s ease-in-out infinite}
  @keyframes halo{
    0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0);background:transparent}
    45%{box-shadow:0 0 0 7px rgba(37,99,235,.10);background:rgba(239,244,255,.9)}
    65%{box-shadow:0 0 0 3px rgba(37,99,235,.16);background:rgba(239,244,255,.6)}
  }
  @media (prefers-reduced-motion:reduce){.icon-btn.breathing{animation:none;box-shadow:0 0 0 4px rgba(37,99,235,.10)}}

  /* 消息滚动区（AiPanel.vue:238-247：p-3 + 细滚动条） */
  .panel-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;scrollbar-width:thin;scrollbar-color:rgba(144,147,153,.4) transparent}
  .panel-scroll::-webkit-scrollbar{width:6px}
  .panel-scroll::-webkit-scrollbar-thumb{background:rgba(144,147,153,.4);border-radius:999px}

  /* 空态卡（AiPanel.vue:261-296：m-3 + border #e3e6ea + r10 + px14 py16） */
  .empty-state{margin:12px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px 14px}
  .greeting{font-weight:650;font-size:13.2px;margin-bottom:3px}
  .welcome{font-size:12.4px;line-height:1.8;color:var(--muted)}
  .storage-note{margin-top:6px;font-size:11.8px;line-height:1.7;color:var(--muted-2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.2px;color:var(--muted);transition:border-color .15s,color .15s}
  .chip:hover{border-color:var(--blue-line);color:var(--blue)}

  /* 消息（AiPanel.vue:345-400 口径：用户 13.5px 气泡 / 助手 13.8px 全宽） */
  .turn{margin-bottom:18px}
  .bubble-user{display:flex;justify-content:flex-end}
  .bubble-user .body{max-width:86%;background:var(--bg-soft);border:1px solid var(--line-2);border-radius:12px;padding:8px 10px;font-size:13.5px;overflow-wrap:anywhere}
  .bubble-ai{font-size:13.8px;padding:0 10px;overflow-wrap:anywhere}
  .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--muted-2)}
  .meta .spacer{flex:1}
  .meta .mini{display:grid;place-items:center;width:22px;height:22px;border:0;background:transparent;border-radius:5px;color:var(--muted-2)}
  .meta .mini:hover{background:var(--bg-soft);color:var(--muted)}
  .meta .mini svg{width:13px;height:13px}
  .stopped{font-size:11.5px;color:var(--muted-2)}
  .working{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted-2)}
  .working i{width:4px;height:4px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 1.2s infinite}
  .working i:nth-child(2){animation-delay:.2s}
  .working i:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  /* HITL 卡（AiPanel.vue:4098-4103 / 4128-4135 / 713-775 / 4219-4246） */
  .card{margin-top:6px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}
  .card-head{display:flex;width:100%;align-items:center;gap:6px;padding:8px 10px;border:0;background:transparent;text-align:left;font:inherit;white-space:nowrap;transition:background .15s}
  .card-head:hover{background:var(--bg-soft)}
  .card-head .ic{display:flex;width:24px;flex:none;align-items:center;justify-content:center;color:var(--muted)}
  .card-head .ic svg{width:15px;height:15px}
  .card-title{font-size:12px;line-height:1.7;font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .card-sub{font-size:11.5px;line-height:1.6;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .status{flex:none;font-size:9.5px;line-height:1.7;padding:0 5px;border-radius:5px;border:1px solid;white-space:nowrap;max-width:104px;overflow:hidden;text-overflow:ellipsis}
  .status.pending{color:var(--blue);background:var(--blue-soft);border-color:var(--blue-line)}
  .status.success{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
  .status.danger{color:var(--danger);background:var(--danger-bg);border-color:var(--line)}
  .chev{color:var(--muted);font-size:12px;margin-left:auto;transform:rotate(90deg);transition:transform .15s}
  .card[data-open="0"] .chev{transform:rotate(0deg)}
  .card-body{padding-bottom:11px}
  .card[data-open="0"] .card-body{display:none}
  .rows{margin:9px 11px 0;border:1px solid var(--line-2);border-radius:8px;padding:2px 10px;max-height:min(280px,35vh);overflow-y:auto;background:#fff}
  .row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px;line-height:1.5}
  .row:last-child{border-bottom:0}
  .row .k{flex:0 1 auto;min-width:0;max-width:40%;color:var(--muted-2);font-size:12.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .v{flex:1;min-width:0;overflow-wrap:anywhere}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 11px 0}
  .actions .group{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .btn{border-radius:8px;padding:5px 13px;font-size:12.6px;white-space:nowrap;transition:all .15s}
  .btn.reject{border:1px solid var(--line);background:#fff;color:var(--muted);min-width:56px}
  .btn.reject:hover{border-color:#8b949e;color:var(--ink)}
  .btn.approve{border:1px solid transparent;background:var(--blue);color:#fff;font-weight:600;min-width:72px}
  .btn.approve:hover{filter:brightness(1.08)}
  .receipt{margin:9px 11px 0;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-soft);padding:8px 10px;font-size:12.4px;color:var(--muted);line-height:1.6}

  /* 输入区（AiPanel.vue:1164-1226） */
  .composer-wrap{border-top:1px solid var(--line-2);background:#fff;padding:10px 14px}
  .composer{border:1px solid var(--line);border-radius:12px;background:#fff;transition:border-color .15s,box-shadow .15s}
  .composer:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.35)}
  .composer textarea{display:block;min-height:40px;max-height:101px;width:100%;resize:none;overflow-y:auto;border:0;border-top-left-radius:12px;border-top-right-radius:12px;background:transparent;padding:11px 11px 7px;font:inherit;font-size:13px;line-height:1.6;color:var(--ink);outline:none;field-sizing:content}
  .composer textarea::placeholder{color:var(--muted-2)}
  .composer-foot{position:relative;display:flex;align-items:center;gap:6px;padding:0 9px 7px}
  .composer-foot .spacer{flex:1}
  .ctx-ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;margin-right:2px}
  .round-btn{margin-left:auto;display:flex;width:28px;height:28px;flex:none;align-items:center;justify-content:center;border-radius:999px;border:0;transition:all .15s}
  .round-btn.stop{background:#1f2328;color:#fff}
  .round-btn.stop:hover{filter:brightness(1.15)}
  .round-btn.stop .sq{display:block;width:9px;height:9px;border-radius:2px;background:#fff}
  .round-btn.send{background:var(--blue);color:#fff;font-size:13px;line-height:1}
  .round-btn.send:hover{filter:brightness(1.08)}
  .round-btn.send:disabled{background:var(--muted-2);color:#fff}
  .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#303133;color:#fff;font-size:11px;line-height:1.5;padding:3px 7px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
  .round-btn:hover .tip,.icon-btn:hover .tip{opacity:1}
</style>
</head>
<body>
<div class="shell">
  <header class="app-head">
    <div class="left">
      <span class="app-title">配置管理平台</span>
      <ul class="app-nav">
        <li class="on">任务中心</li><li>配置定义</li><li>数据浏览</li><li>AI 设置</li><li>AI 反馈</li>
      </ul>
    </div>
    <div class="head-actions">
      <button class="link-btn" type="button">EN</button>
      <button class="link-btn" type="button" id="headToggle">隐藏 AI 栏</button>
    </div>
  </header>

  <main class="app-main">
    <section class="workspace">
      <div class="ws-card">
        <h2 class="ws-title">任务中心</h2>
        <p class="ws-sub">导出配置 / 导入配置 任务管理 · 手动刷新 · 数据截至 10:24:00</p>
        <table class="ws-table">
          <thead><tr><th>任务</th><th>类型</th><th>状态</th><th>当前步骤</th></tr></thead>
          <tbody>
            <tr><td>#12 导出CNY货币字典</td><td>导出配置</td><td><span class="tag">已完成</span></td><td>导出执行</td></tr>
            <tr><td>#11 导出货币字典</td><td>导出配置</td><td><span class="tag run">进行中</span></td><td>查询条件</td></tr>
            <tr><td>#10 导入项目参数</td><td>导入配置</td><td><span class="tag">已完成</span></td><td>导入执行</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <aside class="ai-aside" id="aside">
      <!-- 收起态：48px 竖排条（AiPanel.vue:2-9） -->
      <button class="collapsed-strip" id="collapsedStrip" type="button" aria-label="展开 AI 栏" hidden>
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.6 4.4 4.4 1.6-4.4 1.6L12 15.5l-1.6-4.4L6 9.5l4.4-1.6L12 3.5Z"></path><path d="M18.4 15.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"></path></svg>
        </span>
        <span class="vertical">配置助手</span>
      </button>

      <!-- 展开态 -->
      <div class="panel" id="panel">
        <div class="panel-head">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.6 4.4 4.4 1.6-4.4 1.6L12 15.5l-1.6-4.4L6 9.5l4.4-1.6L12 3.5Z"></path><path d="M18.4 15.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"></path></svg>
          </span>
          <div class="panel-title">配置助手</div>
          <button class="text-btn" id="newChat" type="button" title="新建对话">新建对话</button>
          <button class="icon-btn" id="collapseBtn" type="button" title="收起" aria-label="收起 AI 栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
            <span class="tip">收起</span>
          </button>
        </div>

        <div class="panel-scroll" id="scroll" role="log" aria-label="对话记录">
          <div class="empty-state" id="emptyState">
            <div class="greeting">您好，我是配置助手</div>
            <div class="welcome">
              我可以帮您查询配置项与字段、查看任务，<br>
              打开导出结果在线编辑器、下载导出文件，<br>
              并启动导出/预检查/导入/发布作业。
            </div>
            <div class="storage-note">对话只留本页签浏览器镜像与服务端 24 小时滑动记忆窗口，刷新可恢复、没有长期归档。</div>
            <div class="chips" id="chips">
              <button class="chip" type="button" data-fill="导出cny货币字典（新建任务）">导出cny货币字典</button>
              <button class="chip" type="button" data-fill="查看任务 #12 的导出结果">查看导出结果</button>
              <button class="chip" type="button" data-fill="配置发布的流程规范是什么？">配置发布流程规范</button>
            </div>
          </div>
          <div id="messages"></div>
        </div>

        <div class="composer-wrap">
          <div class="composer">
            <textarea id="input" rows="1" maxlength="8000" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            <div class="composer-foot">
              <span class="spacer"></span>
              <span class="ctx-ring" title="上下文占用" aria-hidden="true"></span>
              <button class="round-btn send" id="sendBtn" type="button" aria-label="发送">↑<span class="tip">发送</span></button>
              <button class="round-btn stop" id="stopBtn" type="button" aria-label="停止" hidden><span class="sq" aria-hidden="true"></span><span class="tip">停止</span></button>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
(function () {
  'use strict'

  var aside = document.getElementById('aside')
  var panel = document.getElementById('panel')
  var strip = document.getElementById('collapsedStrip')
  var collapseBtn = document.getElementById('collapseBtn')
  var headToggle = document.getElementById('headToggle')
  var newChatBtn = document.getElementById('newChat')
  var scrollEl = document.getElementById('scroll')
  var emptyState = document.getElementById('emptyState')
  var chips = document.getElementById('chips')
  var messagesEl = document.getElementById('messages')
  var input = document.getElementById('input')
  var sendBtn = document.getElementById('sendBtn')
  var stopBtn = document.getElementById('stopBtn')

  var state = { messages: [], loading: false, stopped: false, gate: null, timer: null, seq: 0 }

  function el(tag, cls, text) {
    var node = document.createElement(tag)
    if (cls) node.className = cls
    if (text !== undefined && text !== null) node.textContent = text
    return node
  }
  function icon(paths) {
    var ns = 'http://www.w3.org/2000/svg'
    var svg = document.createElementNS(ns, 'svg')
    svg.setAttribute('viewBox', '0 0 24 24')
    svg.setAttribute('fill', 'none')
    svg.setAttribute('stroke', 'currentColor')
    svg.setAttribute('stroke-width', '1.7')
    svg.setAttribute('stroke-linecap', 'round')
    svg.setAttribute('stroke-linejoin', 'round')
    for (var i = 0; i < paths.length; i += 1) {
      var p = document.createElementNS(ns, 'path')
      p.setAttribute('d', paths[i])
      svg.appendChild(p)
    }
    return svg
  }
  function timeText() {
    var d = new Date()
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
  }

  // 停止按钮显示 ⇔ 收起图标呼吸光晕（停止消失即停止）
  function syncActivity() {
    sendBtn.hidden = state.loading
    stopBtn.hidden = !state.loading
    collapseBtn.classList.toggle('breathing', state.loading)
    if (state.loading) {
      stopBtn.focus()
    } else {
      sendBtn.focus()
    }
  }

  function syncEmpty() {
    emptyState.hidden = state.messages.length > 0
  }

  function renderMessage(message) {
    var turn = el('div', 'turn')
    if (message.role === 'user') {
      var wrap = el('div', 'bubble-user')
      wrap.appendChild(el('div', 'body', message.text))
      turn.appendChild(wrap)
    } else {
      var body = el('div', 'bubble-ai')
      var text = el('div', 'ai-text', message.text || '')
      body.appendChild(text)
      if (message.card) body.appendChild(renderCard(message.card))
      var meta = el('div', 'meta')
      if (message.stopped) meta.appendChild(el('span', 'stopped', '已停止'))
      if (message.loading) {
        var working = el('span', 'working')
        working.appendChild(el('i'))
        working.appendChild(el('i'))
        working.appendChild(el('i'))
        working.appendChild(el('span', '', '工作中…'))
        meta.appendChild(working)
      }
      meta.appendChild(el('span', '', timeText()))
      meta.appendChild(el('span', 'spacer'))
      var copy = el('button', 'mini')
      copy.type = 'button'
      copy.title = '复制该条消息正文'
      copy.setAttribute('aria-label', '复制该条消息正文')
      copy.appendChild(icon(['M9 9h10v10H9z', 'M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1']))
      meta.appendChild(copy)
      body.appendChild(meta)
      turn.appendChild(body)
    }
    return turn
  }

  function statusMeta(card) {
    if (card.status === 'pending') return { cls: 'pending', label: '待确认' }
    if (card.status === 'approved') return { cls: 'success', label: '已成功' }
    return { cls: 'danger', label: '已拒绝' }
  }

  function renderCard(card) {
    var shell = el('div', 'card')
    shell.dataset.open = card.open ? '1' : '0'

    var head = el('button', 'card-head')
    head.type = 'button'
    var ic = el('span', 'ic')
    ic.appendChild(icon(['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z', 'M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3', 'M12 17h.01']))
    head.appendChild(ic)
    var titleWrap = el('span')
    titleWrap.style.cssText = 'display:flex;min-width:0;flex:1;align-items:center;gap:6px'
    titleWrap.appendChild(el('span', 'card-title', card.title))
    titleWrap.appendChild(el('span', 'card-sub', card.summary))
    head.appendChild(titleWrap)
    var meta = statusMeta(card)
    head.appendChild(el('span', 'status ' + meta.cls, meta.label))
    head.appendChild(el('span', 'chev', '›'))
    head.addEventListener('click', function () {
      card.open = !card.open
      shell.dataset.open = card.open ? '1' : '0'
    })
    shell.appendChild(head)

    var body = el('div', 'card-body')
    if (card.status === 'pending') {
      var rows = el('div', 'rows')
      for (var i = 0; i < card.rows.length; i += 1) {
        var row = el('div', 'row')
        row.appendChild(el('span', 'k', card.rows[i][0]))
        row.appendChild(el('span', 'v', card.rows[i][1]))
        rows.appendChild(row)
      }
      body.appendChild(rows)
      var actions = el('div', 'actions')
      var group = el('span', 'group')
      var rejectBtn = el('button', 'btn reject', '拒绝')
      rejectBtn.type = 'button'
      var approveBtn = el('button', 'btn approve', '批准')
      approveBtn.type = 'button'
      rejectBtn.addEventListener('click', function () { decide('rejected') })
      approveBtn.addEventListener('click', function () { decide('approved') })
      group.appendChild(rejectBtn)
      group.appendChild(approveBtn)
      actions.appendChild(group)
      body.appendChild(actions)
    } else {
      body.appendChild(el('div', 'receipt', card.receipt))
    }
    shell.appendChild(body)
    return shell
  }

  function render() {
    messagesEl.replaceChildren()
    for (var i = 0; i < state.messages.length; i += 1) {
      messagesEl.appendChild(renderMessage(state.messages[i]))
    }
    syncEmpty()
    syncActivity()
    scrollEl.scrollTop = scrollEl.scrollHeight
  }

  function decide(status) {
    var last = state.messages[state.messages.length - 1]
    if (!last || !last.card || last.card.status !== 'pending') return
    last.card.status = status
    last.card.open = false
    last.card.receipt = status === 'approved'
      ? '已启动导出作业（作业 #12），进度由页面展示。'
      : '已拒绝启动导出作业，未产生任何作业。'
    render()
  }

  function send() {
    var text = input.value.trim()
    if (!text || state.loading) return
    state.messages.push({ role: 'user', text: text })
    input.value = ''
    state.stopped = false
    state.loading = true
    state.seq += 1
    var current = { role: 'assistant', text: '', card: null, loading: true, stopped: false }
    state.messages.push(current)
    render()
    if (state.timer !== null) window.clearTimeout(state.timer)
    state.timer = window.setTimeout(function () {
      state.timer = null
      state.loading = false
      current.loading = false
      current.text = '好的，我先为您创建导出任务；目前已进入「导出执行」，需要您确认后才会启动作业。'
      current.card = {
        title: '待你确认：导出 任务 #12『导出CNY货币字典』',
        summary: '启动导出作业',
        status: 'pending',
        open: true,
        rows: [['操作', '启动导出作业'], ['任务', '导出CNY货币字典']],
        receipt: ''
      }
      render()
    }, 900)
  }

  function stopRun() {
    if (!state.loading) return
    if (state.timer !== null) window.clearTimeout(state.timer)
    state.timer = null
    state.loading = false
    var current = state.messages[state.messages.length - 1]
    if (current && current.role === 'assistant') {
      current.loading = false
      current.stopped = true
      if (!current.text) current.text = '（已停止，未继续生成）'
    }
    render()
  }

  function newChat() {
    if (state.timer !== null) window.clearTimeout(state.timer)
    state.timer = null
    state.messages = []
    state.loading = false
    state.stopped = false
    input.value = ''
    render()
    input.focus()
  }

  function collapse() {
    aside.classList.add('collapsed')
    panel.hidden = true
    strip.hidden = false
    headToggle.textContent = '显示 AI 栏'
    strip.focus()
  }

  function expand() {
    aside.classList.remove('collapsed')
    panel.hidden = false
    strip.hidden = true
    headToggle.textContent = '隐藏 AI 栏'
    collapseBtn.focus()
  }

  // 示例只回填输入框，不自动发送
  chips.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-fill]')
    if (!btn) return
    input.value = btn.getAttribute('data-fill')
    input.focus()
    input.setSelectionRange(input.value.length, input.value.length)
  })

  sendBtn.addEventListener('click', send)
  stopBtn.addEventListener('click', stopRun)
  newChatBtn.addEventListener('click', newChat)
  collapseBtn.addEventListener('click', collapse)
  strip.addEventListener('click', expand)
  headToggle.addEventListener('click', function () {
    if (aside.classList.contains('collapsed')) expand()
    else collapse()
  })
  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault()
      send()
    }
  })

  render()
})()
</script>
</body>
</html>
