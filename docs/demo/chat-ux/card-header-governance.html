  function esc(value) {
    return String(value === null || value === undefined ? '' : value)

  }

  function fileRow(b) {
    return '<div class="flex items-center gap-2 rounded-[8px] border border-solid border-[#eef0f3] bg-[#fbfcfd] px-2.5 py-[6px]">' +
      '<span class="min-w-0 flex-1 truncate text-[12px] text-[#1f2328]">' + esc(b.file) + '</span>' +
      '<span class="flex-none text-[10.5px] text-[#8b949e]">' + esc(b.size || '') + '</span>' +
      '</div>';
  }

  function buttonsHtml(c) {
    var secondary = 'rounded-[8px] border border-solid border-[#e3e6ea] bg-white px-3 py-[5px] text-[12px] text-[#57606a]';
    var primary = 'rounded-[8px] border border-solid border-transparent bg-[#2563eb] px-3 py-[5px] text-[12px] font-semibold text-white';
    var primaryDisabled = 'rounded-[8px] border border-solid border-transparent bg-[#98a2b3] px-3 py-[5px] text-[12px] font-semibold text-white disabled:cursor-default';
    if (c.kind === 'hitl') {
      return '<div class="mt-2 flex justify-end gap-2"><button type="button" class="' + secondary + '">拒绝</button><button type="button" class="' + primary + '">批准</button></div>';
    }
    if (c.kind === 'form') {
      return '<div class="mt-2 flex justify-end gap-2"><button type="button" class="' + secondary + '">取消</button><button type="button" class="' + primary + '">提交</button></div>';
    }
    if (c.kind === 'sheet') {
      var apply = c.applyDisabled
        ? '<button type="button" class="' + primaryDisabled + '" disabled>应用</button>'
        : '<button type="button" class="' + primary + '">应用</button>';
      return '<div class="mt-2 flex justify-end gap-2"><button type="button" class="' + secondary + '">取消</button>' + apply + '</div>';
    }
    return '';
  }

  function diffHtml(rows) {
    return '<div class="mt-2 overflow-hidden rounded-[8px] border border-solid border-[#eef0f3]"><table class="w-full table-fixed text-[11.5px] leading-[1.5]">' +
      '<thead><tr class="bg-[#f6f7f9] text-[10.5px] text-[#667085]"><th class="px-2 py-1 text-left font-semibold">配置项</th><th class="px-2 py-1 text-left font-semibold">行键</th><th class="px-2 py-1 text-left font-semibold">变更</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr class="border-t border-[#eef0f3]"><td class="truncate px-2 py-1 text-[#1f2328]">' + esc(r[0]) + '</td><td class="truncate px-2 py-1 text-[#57606a]">' + esc(r[1]) + '</td><td class="px-2 py-1 text-[#57606a]">' + esc(r[2]) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function bodyHtml(c, side) {
    var b = c.body || {};
    var parts = [];
    if (b.danger) parts.push('<div class="rounded-[9px] border border-solid border-[#f0d5d0] bg-[#fff8f6] px-[11px] py-[9px] text-[12.3px] leading-[1.6] text-[#9f2f22]">' + esc(b.danger) + '</div>');
    if (b.warning) parts.push('<div class="rounded-[9px] border border-solid border-[#fde68a] bg-[#fffbeb] px-[11px] py-[9px] text-[12.3px] leading-[1.6] text-[#8a5809]">' + esc(b.warning) + '</div>');
    if (b.rows) parts.push(rowsHtml(b.rows));
    if (b.file) parts.push(fileRow(b));
    if (b.meta) parts.push('<div class="text-[12px] leading-[1.55] text-[#57606a]">' + esc(b.meta) + '</div>');
    if (b.diff) parts.push(diffHtml(b.diff));
    if (b.ack) parts.push('<label class="mt-2 flex items-start gap-2 text-[12px] leading-[1.55] text-[#1f2328]"><input type="checkbox" class="mt-[3px] h-[13px] w-[13px] flex-none accent-[#2563eb]"><span>' + esc(b.ack) + '</span></label>');
    if (b.hint) parts.push('<div class="mt-1 text-[11px] leading-[1.5] text-[#8a5809]">' + esc(b.hint) + '</div>');
    if (b.note) parts.push('<div class="' + (parts.length ? 'mt-2 ' : '') + 'text-[12.2px] leading-[1.65] text-[#57606a]">' + esc(b.note) + '</div>');
    if (b.result) parts.push('<div class="' + (parts.length ? 'mt-2 ' : '') + 'rounded-[8px] border border-solid border-[#f0d5d0] bg-[#fdf1ef] px-[10px] py-[7px] text-[12.2px] leading-[1.6] text-[#a93226]">' + esc(b.result) + '</div>');
    if (b.text) parts.push('<div class="whitespace-pre-wrap text-[12.6px] leading-[1.7] text-[#57606a]">' + esc(b.text) + '</div>');
    if (b.action) {
      var cls = b.disabled
        ? 'rounded-[8px] border border-solid border-transparent bg-[#98a2b3] px-3 py-[5px] text-[12px] font-medium text-white'
        : 'rounded-[8px] border border-solid border-[#e3e6ea] bg-white px-3 py-[5px] text-[12px] text-[#57606a]';
      parts.push('<div class="mt-2 flex justify-end"><button type="button" class="' + cls + '"' + (b.disabled ? ' disabled' : '') + '>' + esc(b.action) + '</button></div>');
    }
    if (b.submitting) parts.push('<div class="mt-2 flex justify-end"><button type="button" disabled class="rounded-[8px] border border-solid border-transparent bg-[#98a2b3] px-3 py-[5px] text-[12px] font-medium text-white">提交中…</button></div>');
    if (b.buttons) parts.push(buttonsHtml(c));
    return parts.join('');
  }

  function fullTitle(c, side, expanded) {
    if (side !== 'next' || !expanded) return '';
    if (!c.title || c.title.length <= 34) return '';
    return '<div class="mb-2 text-[11.5px] leading-[1.55] text-[#57606a] [overflow-wrap:anywhere]">' + esc(c.title) + '</div>';
  }

  function cardShellClass() {
    return state.panel === 'narrow' ? 'w-full max-w-[340px]' : 'w-full';
  }

  function renderStandardCard(c, side, expanded) {
    var isNext = side === 'next';
    var bodyId = (isNext ? 't-' : 'c-') + c.id;
    var sub = c.sub ? '<span class="min-w-0 shrink-[3] truncate text-[11px] leading-[1.4] text-[#8b949e]' + (isNext && state.panel === 'narrow' ? ' hidden' : '') + '">' + esc(c.sub) + '</span>' : '';
    var headerInner = '<span class="flex w-[24px] flex-none items-center justify-center text-[#57606a]">' + ICONS[c.kind] + '</span>' +
      '<span class="flex min-w-0 flex-1 items-center gap-[6px]"><span class="min-w-0 truncate text-[12px] leading-[1.5] [font-weight:650] text-[#1f2328]">' + esc(c.title) + '</span>' + sub + '</span>' +
      statusChip(c, side) +
      (isNext ? '<span data-chev class="ml-[1px] flex-none text-[12px] leading-none text-[#8b949e] transition-transform duration-150' + (expanded ? ' rotate-90' : '') + '" aria-hidden="true">›</span>' : '');
    var head = isNext
      ? '<button type="button" data-toggle aria-expanded="' + expanded + '" aria-controls="' + bodyId + '" class="flex w-full items-center gap-[6px] px-[10px] py-[8px] text-left transition-colors duration-150 hover:bg-[#f6f7f9] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb]">' + headerInner + '</button>'
      : '<div class="flex w-full items-center gap-[6px] px-[10px] py-[8px] text-left">' + headerInner + '</div>';
    var bodyContent = fullTitle(c, side, expanded) + bodyHtml(c, side);
    var bodyClass = 'px-[10px] pb-[10px] pt-[2px]' + (isNext && !expanded ? ' hidden' : '');
    return '<article class="' + cardShellClass() + ' overflow-hidden rounded-[10px] border border-solid border-[#e3e6ea] bg-white">' + head + '<div id="' + bodyId + '" class="' + bodyClass + '">' + bodyContent + '</div></article>';
  }

  function renderReasoning(c, side, expanded) {
    var isNext = side === 'next';
    var bodyId = (isNext ? 't-' : 'c-') + c.id;
    var timer = '<span class="flex-none text-[11.5px] leading-[1.45] text-[#8b949e]">' + c.seconds + ' 秒</span>';
    var chev = isNext ? '<span data-chev class="ml-[1px] flex-none text-[12px] leading-none text-[#8b949e] transition-transform duration-150' + (expanded ? ' rotate-90' : '') + '" aria-hidden="true">›</span>' : '';
    var inner = '<span class="flex h-[15px] w-[15px] flex-none items-center justify-center rounded-full border border-solid border-[#e3e6ea] text-[9px] text-[#8b949e]" aria-hidden="true">⋆</span>' +
      '<span class="min-w-0 flex-1 truncate text-[12.4px] leading-[1.45] text-[#57606a]">' + esc(c.title) + '</span>' + timer + chev;
    var head = isNext
      ? '<button type="button" data-toggle aria-expanded="' + expanded + '" aria-controls="' + bodyId + '" class="flex w-full items-center gap-[8px] px-[10px] py-[7px] text-left transition-colors duration-150 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb]">' + inner + '</button>'
      : '<div class="flex w-full items-center gap-[8px] px-[10px] py-[7px] text-left">' + inner + '</div>';
    var body = '<div class="border-l-2 border-solid border-[#e3e6ea] pl-[10px] pr-[11px] pb-[10px]"><div class="whitespace-pre-wrap text-[12.6px] leading-[1.7] text-[#57606a]">' + esc(c.body.text) + '</div></div>';
    var bodyAttr = isNext && !expanded ? ' class="hidden"' : '';
    return '<article class="' + cardShellClass() + ' overflow-hidden rounded-[10px] border border-solid border-[#e3e6ea] bg-[#f6f7f9]">' + head + '<div id="' + bodyId + '"' + bodyAttr + '>' + body + '</div></article>';
  }

  function renderStage(c, side) {
    var seconds = Math.max(stageState.base, Math.floor((Date.now() - stageState.start) / 1000));
    if (c.variant === 'compacting') {
      if (side === 'current') {
        return '<div class="' + cardShellClass() + ' flex items-center gap-2 rounded-[10px] border border-solid border-[#e3e6ea] bg-white px-2.5 py-2 text-[11.5px] leading-[1.5] text-[#7c3aed]"><span class="h-1.5 w-1.5 rounded-full bg-[#7c3aed]"></span><span>压缩中…</span></div>';
      }
      return '<div class="' + cardShellClass() + ' flex items-center gap-2 rounded-[10px] border border-solid border-[#ddd6fe] bg-[#faf8ff] px-2.5 py-2 text-[11.5px] leading-[1.5] text-[#6d28d9]"><span class="h-1.5 w-1.5 rounded-full bg-[#7c3aed] animate-breathe"></span><span>正在整理上下文</span></div>';
    }
    if (c.variant === 'compacted') {
      var label = side === 'current' ? '已压缩上下文' : '上下文已整理';
      return '<div class="' + cardShellClass() + ' flex items-center gap-2 rounded-[10px] border border-solid border-[#e3e6ea] bg-white px-2.5 py-2 text-[11.5px] leading-[1.5] text-[#8b949e]"><span class="h-px flex-1 bg-[#e3e6ea]"></span><span>' + label + '</span><span class="h-px flex-1 bg-[#e3e6ea]"></span></div>';
    }
    return '<div class="' + cardShellClass() + ' flex items-start gap-2 rounded-[10px] border border-solid border-[#dbeafe] bg-[#eff6ff] px-[11px] py-[7px]">' +
      '<span class="mt-1 h-[7px] w-[7px] flex-none rounded-full bg-[#2563eb] animate-breathe"></span>' +
      '<div class="min-w-0 flex-1"><div class="text-[12.4px] leading-[1.5] text-[#1f2328]"><span data-live>' + seconds + '</span> 秒 · 正在准备本轮回答</div><div class="mt-0.5 text-[11.2px] leading-[1.5] text-[#57606a]">可以等待，或立即重试。</div></div>' +
      '<button type="button" data-retry class="flex-none rounded-[8px] border border-solid border-[#e3e6ea] bg-white px-[11px] py-[4px] text-[12px] text-[#57606a]">立即重试</button></div>';
  }

  function renderCard(c, side, expanded) {
    if (c.kind === 'stage') return renderStage(c, side);
    if (c.kind === 'reasoning') return renderReasoning(c, side, expanded);
    return renderStandardCard(c, side, expanded);
  }

  function isOpen(c) {
    if (state.expanded[c.id] === undefined) return !!c.open;
    return state.expanded[c.id];
  }

  function gridClass() {
    if (state.compare !== 'both' || state.panel === 'narrow') return 'mt-2 grid grid-cols-1 items-start gap-3';
    return 'mt-2 grid grid-cols-1 items-start gap-3 xl:grid-cols-2';
  }

  function pane(side, c) {
    var label = side === 'current' ? '当前版' : '目标版';
    var expanded = side === 'next' ? isOpen(c) : true;
    var tag = side === 'next' && c.kind !== 'stage'
      ? '<span class="rounded border border-[#e3e6ea] bg-white px-1.5 py-[1px] text-[9.5px] text-[#8b949e]">' + (expanded ? '默认展开' : '默认折叠') + '</span>'
      : '';
    return '<div class="min-w-0"><div class="mb-[6px] flex items-center gap-1.5"><span class="text-[10px] font-semibold uppercase tracking-[.08em] ' + (side === 'next' ? 'text-[#2563eb]' : 'text-[#667085]') + '">' + label + '</span>' + tag + '</div>' + renderCard(c, side, expanded) + '</div>';
  }

  function renderScenario(c) {
    var panes = '';
    if (state.compare !== 'next') panes += pane('current', c);
    if (state.compare !== 'current') panes += pane('next', c);
    return '<section class="border-t border-[#eef0f3] pt-4 first:border-t-0 first:pt-0">' +
      '<div class="flex flex-wrap items-baseline gap-2"><h3 class="m-0 text-[12.5px] font-semibold leading-[1.45] text-[#1f2328]">' + esc(c.title.length > 34 ? c.title.slice(0, 32) + '…' : c.title) + '</h3>' +
      (c.status ? '<span class="text-[10.5px] text-[#8b949e]">' + esc(c.status[0]) + '</span>' : '') +
      (c.kind === 'reasoning' ? '<span class="text-[10.5px] text-[#8b949e]">思考卡 · 无状态标签</span>' : '') +
      (c.kind === 'stage' ? '<span class="text-[10.5px] text-[#8b949e]">阶段提示 · 无卡头</span>' : '') + '</div>' +
      '<div class="' + gridClass() + '">' + panes + '</div></section>';
  }

  function renderNav() {
    var nav = document.getElementById('group-nav');
    nav.innerHTML = GROUPS.map(function (g, index) {
      var active = index === state.group;
      return '<button type="button" data-group="' + index + '" aria-current="' + (active ? 'true' : 'false') + '" class="flex w-full items-center justify-between gap-2 rounded-lg border border-transparent px-2.5 py-1.5 text-left text-[11.5px] leading-[1.45] ' + (active ? 'border-[#cddcff] bg-[#eff4ff] text-[#1f2328]' : 'text-[#57606a] hover:bg-white') + '"><span class="min-w-0 truncate">' + esc(g.name) + '</span><span class="flex-none font-mono text-[10.5px] text-[#8b949e]">' + g.cases.length + '</span></button>';
    }).join('');
    document.getElementById('group-total').textContent = '共 ' + GROUPS.reduce(function (n, g) { return n + g.cases.length; }, 0) + ' 个场景';
  }

  function render() {
    var group = GROUPS[state.group];
    var total = GROUPS.reduce(function (n, g) { return n + g.cases.length; }, 0);
    document.getElementById('workspace').innerHTML = '<div class="rounded-xl border border-[#e3e6ea] bg-white p-4">' +
      '<div class="flex flex-wrap items-baseline gap-2"><h2 class="m-0 text-[13px] font-semibold leading-[1.45]">' + esc(group.name) + '</h2><span class="text-[10.5px] text-[#8b949e]">' + group.cases.length + ' 个场景 · 全页 ' + total + '</span>' +
      (group.note ? '<span class="text-[10.5px] text-[#8b949e]">' + esc(group.note) + '</span>' : '') + '</div>' +
      '<div class="mt-4 space-y-4">' + group.cases.map(renderScenario).join('') + '</div></div>';
  }

  function applyPanel() {
    document.querySelectorAll('[data-panel]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.getAttribute('data-panel') === state.panel));
    });
  }

  function applyCompare() {
    document.querySelectorAll('[data-compare]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.getAttribute('data-compare') === state.compare));
    });
  }

  document.addEventListener('click', function (event) {
    var groupButton = event.target.closest('[data-group]');
    if (groupButton) {
      state.group = Number(groupButton.getAttribute('data-group'));
      renderNav();
      render();
      return;
    }
    var compareButton = event.target.closest('[data-compare]');
    if (compareButton) {
      state.compare = compareButton.getAttribute('data-compare');
      applyCompare();
      render();
      return;
    }
    var panelButton = event.target.closest('[data-panel]');
    if (panelButton) {
      state.panel = panelButton.getAttribute('data-panel');
      applyPanel();
      render();
      return;
    }
    var retry = event.target.closest('[data-retry]');
    if (retry) {
      stageState.start = Date.now();
      stageState.base = 0;
      tick();
      return;
    }
    var toggle = event.target.closest('[data-toggle]');
    if (!toggle) return;
    var bodyId = toggle.getAttribute('aria-controls');
    var body = bodyId ? document.getElementById(bodyId) : null;
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    if (body) body.classList.toggle('hidden', open);
    var chev = toggle.querySelector('[data-chev]');
    if (chev) chev.classList.toggle('rotate-90', !open);
  });

  function tick() {
    var seconds = Math.max(stageState.base, Math.floor((Date.now() - stageState.start) / 1000));
    document.querySelectorAll('[data-live]').forEach(function (el) { el.textContent = String(seconds); });
  }

  setInterval(tick, 1000);
  renderNav();
  render();
})();
</script>
</body>
</html>
