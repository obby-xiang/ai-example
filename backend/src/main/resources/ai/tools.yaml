# 工具定义覆盖（阶段 A：classpath YAML）
#
# 契约（本批裁决 D-3）：**注解是缺省，本文件是可选覆盖**。
# - 只有写了的字段才覆盖；`description` / `inputSchema` 缺省 ⇒ 用 `@Tool` / `@ToolParam` 反射值；
# - 写了 `inputSchema` 就与反射 schema 对账（property 名/类型 + required 集合），漂移即启动失败；
# - `modelName` 缺省 = `toolKey`；`titleKey` 缺省 = `tool.<toolKey>.title`；
# - `status` 缺省视为 published。
#
# 本批（S2）只落 UI 标题（title/titleKey）：模型侧 description 保持注解中文单语
# （裁决 A/B：模型侧单语、不随用户 locale 切；切英文是独立评测项，不在本批）。
#
# 改 description 会击穿 prompt 缓存（tools → system → messages 前缀），故将来改描述
# 必须发新 version 并留痕，禁止"保存即生效"式编辑。
# 2026-10-27.2 → 2026-10-27.3（2026-10-28 步骤披露与筛选链路收口）：向导动作按**能成功的步骤**披露，
# set_condition 只能在 QUERY_COND 调、SELECT_DEFS 下必须先 confirm_step 推进；描述与注解 @ToolScope
# 同批改（披露面与前端 allowSteps 同源），改描述必升 version（破 prompt 缓存）。
# 2026-10-27.3 → 2026-10-27.4（2026-10-28 已知信息复用收口）：用户已明确的配置项/筛选条件与值直接用于工具，
# generative_form 只补真实信息缺口（不用于已知信息、预填确认、取消后自动重问）；描述与注解 @Tool 同批改，
# 改描述必升 version（破 prompt 缓存）。
# 2026-10-27.4 → 2026-10-27.5（2026-10-28 槽位填充 + 条件放行）：表单用途 purpose 显式化
# （SELECT_DEFINITIONS/SET_CONDITIONS/GENERAL_CLARIFY，缺省 GENERAL_CLARIFY），宿主按 purpose 与
# 「任务槽位」判断槽位是否已齐；槽位已确定的收集表单被零副作用拒绝（FORM_SLOTS_ALREADY_KNOWN）。
# 2026-10-27.5 → 2026-10-27.6（2026-10-29 规则冲突统一）：任务已完成（COMPLETED）不再是下载/打开编辑器的
# 理由（只在用户明确意图时调用，状态不是授权）；未设筛选按「全量」呈现（不设条件即全量，不再反复收集条件）。
# 2026-10-27.6 → 2026-10-27.7（2026-10-29 复核返修）：confirm_step 的"失败即停"补第 29 条零副作用一次纠正例外
# （同参数/同目标仍禁），YAML 与 AiTools 注解回落同批；改描述必升 version（破 prompt 缓存）。
# 2026-10-27.7 → 2026-10-27.8（2026-10-29 审核问题 1/2，新建任务口径）：无论任务中心还是已有/已完成任务页面，
# 用户明确要新建导出/导入任务就直接调 create_task（只 type + 可选 title，不先追问配置/文件、不先用
# list_config_defs 摸底）；旧任务的配置/步骤/完成状态不属于新任务（除非用户明确要求沿用）。
# 2026-10-27.8 → 2026-10-27.9（2026-10-29 闭环批：任务类型与筛选条件收集口径）：类型未知必须用
# generative_form(purpose=TASK_TYPE) 的单个 enum 单选（EXPORT/IMPORT），不文字反问；类型已确定时零副作用
# 拒绝并指回 create_task。条件只在 QUERY_COND 用一个非必填自由文本框（longText 可选）收集，留空即全量推进；
# 条件已明确或已到 EXPORT 及之后不再收条件表单（该口径已在 .10 收紧为只在 QUERY_COND，见下条）。
# 描述与注解 @Tool 同批改，version 同步升。
# 2026-10-27.9 → 2026-10-27.10（2026-10-29 返修：条件框只在 QUERY_COND 出现一次）：守卫收成
# 「有明确步骤时只有 QUERY_COND 允许 SET_CONDITIONS」（SELECT_DEFS/EXPORT/DONE/导入链一律零副作用拒绝）；
# 规则 30 / confirm_step / set_condition 的描述统一为「进入 QUERY_COND 给一次非必填自由文本框，留空直接推进，
# 不得重复收集或文字追问」，删除与规则 26 冲突的「不要为条件弹表单」旧口径。
# 2026-10-27.11 → 2026-10-27.12（Task 1 导出条件与一轮闭环）：confirm_step 增加"禁止 SELECT_DEFS 直接跳 EXPORT"
# 与"条件已知/非空回灌未落库时零副作用拒绝并指回 set_condition"；generative_form 的条件表回灌非空文本必须先
# set_condition 落库再 confirm_step。改描述必升 version（破 prompt 缓存）。
# 2026-10-27.10 → 2026-10-27.11（2026-10-29 已知信息口径补强）：配置已明确不只看编码 ——
# 中文名称/别名、以及模型已用 list_config_defs / get_config_def 确认过的编码映射同样算已知，
# 确认后直接 select_definitions，不下发选择表单（系统提示词总纲与规则 30 同批改）。
version: 2026-10-27.12
lang: zh
tools:
  - toolKey: list_config_defs
    title: 列出配置定义
  - toolKey: get_config_def
    title: 读取配置定义
  - toolKey: list_tasks
    title: 列出任务
  - toolKey: get_workspace_state
    title: 读取工作区状态
  - toolKey: check_job_status
    title: 查询作业状态
  - toolKey: get_row_count
    title: 预估数据行数
  - toolKey: create_task
    title: 创建任务
    # 2026-10-29（审核问题 1/2）：新建任务就是新建 —— 不先追问配置/筛选/文件、不拿 list_config_defs 摸底、
    # 旧任务的配置与状态不自动带入。改描述击穿 prompt 缓存，version 同步升到 2026-10-27.8。
    description: >-
      用户明确要新建导出/导入任务时直接调用（任务中心、已有任务或已完成任务页面都适用）：
      不要先追问配置项、筛选条件或数据文件，也不要用 list_config_defs 代替创建。
      创建只需要任务类型 type（EXPORT/IMPORT）与可选 title：标题不追问，缺省按类型生成；
      类型无法判断时才用 generative_form(purpose=TASK_TYPE) 的单个 enum 单选选类型（选项正好 EXPORT/IMPORT），
      不要用文字反问；类型已确定时绝不弹类型表单。旧任务的配置项、筛选条件、步骤与完成状态不属于新任务，
      不自动带入，除非用户明确要求沿用。前置：确认卡批准后才会创建；同一轮最多一次；
      同轮重复调用会复用或明确拒绝。创建不等于执行：不会启动任何作业。
      批准后用 navigate_to(page=..., taskId=...) 打开向导。
  - toolKey: start_export
    title: 启动导出作业
    description: >-
      启动配置导出作业（需要用户确认）。前置：EXPORT 任务已选配置项；任务未终态（CANCELLED/已完成导出成功
      的任务不可再导出）、无同类在途作业。任务已完成时不要重复发起导出；下载或打开编辑器只在用户明确
      要求时进行（已完成状态本身不是授权）。
  - toolKey: start_precheck
    title: 启动预检查作业
    description: >-
      启动预检查作业（需要用户确认）。前置：IMPORT 任务已选配置项且已上传数据文件；无在途作业。
  - toolKey: start_import
    title: 启动导入作业
    description: >-
      启动导入作业（需要用户确认）。前置：IMPORT 任务有上传文件，且最近一次预检查通过且未过期；无在途作业。
  - toolKey: start_publish
    title: 启动发布作业
    description: >-
      启动发布作业（需要用户确认，不可撤销）。前置：IMPORT 任务、最近一次预检查通过；发布模式由任务设置决定
      （MERGE/REPLACE），以确认卡上的权威值为准，不以对话文本为准。
  - toolKey: open_export_file_editor
    title: 打开导出文件在线编辑器
    description: >-
      打开导出文件的在线编辑器（前端执行）。前置：EXPORT 任务已有成功导出作业/导出文件。
      只在用户明确提出查看/编辑导出文件意图时调用；任务已完成（COMPLETED）本身不是授权，
      不要把它当作已完成任务的下一步建议。
  - toolKey: download_export_files
    title: 下载导出文件
    description: >-
      下载导出文件（前端执行）。前置：EXPORT 任务已有成功导出作业/导出文件。
      只在用户明确提出下载/获取文件意图时调用；任务已完成（COMPLETED）本身不是授权，
      不要用它替代 start_export，也不要仅凭状态自动下载。
  - toolKey: navigate_to
    title: 跳转页面
    description: >-
      跳转页面并绑定任务（前端执行）。前置：目标页面存在；create_task 返回任务 id 后用它打开该任务向导。
      导航成功不是本轮终点：下一批按最新披露继续页面动作，不要在同一批里并排调用后续动作。
      同一目标页不要重复导航。
  - toolKey: select_definitions
    title: 选择配置项
    description: >-
      在工作区勾选配置项（前端执行，勾选即落任务项）。前置：已打开对应导出/导入向导并绑定 taskId，
      且当前在「选择配置」步（导出 SELECT_DEFS / 导入 UPLOAD）—— 只在它被披露的步骤调用。
      选择项优先用本工具，不要用开放式文字询问。用户已明确配置定义时直接调用，不用表单重复询问（编码、中文名称/别名、或已用 list_config_defs / get_config_def 确认的映射都算已明确）。
  - toolKey: set_condition
    title: 设置查询条件
    description: >-
      设置导出查询条件（前端执行，立即落库）。前置：EXPORT 任务且当前在 QUERY_COND 步骤；
      条件必须是结构化对象（fields[].fieldCode/operator/value + 可选 scopeKeys），不要传扁平参数。
      用户给出条件（含 generative_form(purpose=SET_CONDITIONS) 自由文本框回填后解析出的条件）时才调用；
      用户没给条件就不设筛选（不设条件即全量），不要为凑条件而调用。
      已知条件直接使用，但仍遵守 QUERY_COND 与 confirm_step 链。
      本工具只能在 QUERY_COND 步骤调用：若当前是 SELECT_DEFS，先 confirm_step（不传 step）
      推进到 QUERY_COND，下一批再调用本工具，不要在 SELECT_DEFS 这一批抢跑（前端会以步骤不符拒绝）。
  - toolKey: confirm_step
    title: 确认步骤
    description: >-
      确认并推进向导步骤（前端执行）。默认不传 step，只前进一步；step 仅在用户点名目标步骤或
      明确要求跳过筛选时才传，不要擅自跳步。前置：当前步骤校验通过。推进成功后不要结束本轮，
      下一批按最新披露继续（不要在同一批里连续推进）；推进失败即停，如实说明原因与当前步骤，
      不要重试推进或跳步（第 29 条窄例外除外：回执给出纠正指引且本次零副作用时，
      允许一次不同的纠正动作；同参数/同目标仍在禁止之列）。step 的合法枚举：导出向导 SELECT_DEFS/QUERY_COND/EXPORT；
      导入向导 UPLOAD/PRECHECK/IMPORT/PUBLISH（导入没有 SELECT_DEFS 步）。
      用户已提出筛选条件时也照此推进：先到 QUERY_COND，下一批再 set_condition。
      禁止从 SELECT_DEFS 直接跳到 EXPORT（那条路会跳过 QUERY_COND 与条件收集，会被宿主零副作用拒绝）；
      即使传 step，也必须先完成 QUERY_COND 才能推进到 EXPORT。
      未设筛选是正常状态（= 全量导出）：进入 QUERY_COND 时按 generative_form(purpose=SET_CONDITIONS) 给一次
      非必填自由文本框（只此一次，留空即照常推进）；不要停在原地、重复收集或用文字追问是否筛选。
      条件已知但尚未落库、或条件表回灌了非空文本却还没 set_condition 时，confirm_step 会被零副作用拒绝
      并指回 set_condition：先把条件落库，下一批再推进。
  - toolKey: generative_form
    title: 生成式表单
    # 批次4 集成返修：表单选项数据源此前只写了 definition_fields，`definitions`（层级→定义）虽已在
    # GenerativeFormRules.OPTION_SOURCE_IDS 里注册，模型却无从得知 ⇒ 只能靠 map 写死选项。
    # 改 description 会击穿 prompt 缓存（tools → system → messages 前缀），故 version 同步 +1。
    description: >-
      在对话内渲染一张结构化表单并等待用户填写/选择（用于向用户收集筛选条件、任务类型，或在信息不足时向用户澄清）；
      只用于真实信息缺口（缺失或歧义且需结构化补充），不用于已知信息、预填确认或取消后自动重问。
      表单用途必须显式给出 purpose=SELECT_DEFINITIONS（收集配置项选择）/ SET_CONDITIONS（收集筛选条件）/
      TASK_TYPE（收集任务类型 EXPORT/IMPORT）/ GENERAL_CLARIFY（通用澄清，缺省）；宿主只按 purpose 判断用途，
      禁止靠标题猜。
      TASK_TYPE 只在任务类型未知时用：表单只有一个 enum 字段做单选项，选项正好 EXPORT/IMPORT，不附其它字段；
      类型已确定（任务槽位有「已确定任务类型」或用户已说明导出/导入）时会被零副作用拒绝并指回 create_task。
      SET_CONDITIONS 只在 QUERY_COND 收集：表单只有一个非必填自由文本框（type=text，可加 variant=longText），
      把用户文本解析成 set_condition 的结构化条件（fields[].fieldCode/operator/value）；留空即不设筛选，
      直接 confirm_step 全量推进；非空文本必须先调用 set_condition 落库再 confirm_step（否则 confirm_step 会被
      零副作用拒绝并指回 set_condition）；条件已明确或当前步骤不是 QUERY_COND 会被零副作用拒绝（SELECT_DEFS 先
      confirm_step 推进，EXPORT 及之后一律拒绝），不再重复收集。
      系统工作区状态里的「任务槽位」是已知值：槽位已确定的收集表单会被拒绝（FORM_SLOTS_ALREADY_KNOWN），
      请直接调用对应工具；未知配置或歧义时表单仍可用。配置项已明确（编码、中文名称/别名，或已用
      list_config_defs / get_config_def 确认的映射）时直接调用 select_definitions，不下发选择表单。
      字段类型仅限白名单 text/number/boolean/date/enum/multi_select/attachment，禁止 HTML/脚本/自定义属性。
      选择题的选项有三种来源：options（写死）、optionsFrom.map（父值 → 选项，静态映射）、
      optionsFrom.sourceId（后端注册数据源，闭集两个：definition_fields = 父值(配置定义编码) → 该定义的字段；
      definitions = 父值(层级 GLOBAL/REGION/PROJECT) → 该层级的配置定义，即「层级→定义」用法）。
      optionsFrom / defaultFrom 的 dependsOn 必填（没有父字段就没有级联），URL/脚本等自定义数据源一律被拒。
      表单只收集值、不推进步骤：提交后向导仍停在原步骤，"用户无需手动跳步"不等于可以跳过 confirm_step
      （如当前是 SELECT_DEFS，下一批先 confirm_step 到 QUERY_COND，再 set_condition；不要拿到值后直接启动作业）。
      工具结果是统一信封 JSON（outcome/code/retryable/target/message）：用户提交后，字段 key→值的 JSON 原文
      在 message 字段里（读取它，不要把整个信封当表单数据）；用户关闭表单则 outcome=cancelled、无数据；
      schema 不合规则 outcome=rejected 且表单未下发。
  - toolKey: read_sheet_summary
    title: 读取表格摘要
  - toolKey: aggregate_sheet
    title: 聚合表格
  - toolKey: inspect_columns
    title: 诊断列映射
  - toolKey: review_cells
    title: 本地校验摘要
  - toolKey: find_rows
    title: 查找所在行
  - toolKey: normalize_column
    title: 列归一化
  - toolKey: replace_values
    title: 查找替换
  - toolKey: update_rows
    title: 条件更新行
  - toolKey: undo_last_sheet_edit
    title: 撤销 AI 表格修改
