# 工具定义覆盖（阶段 A：classpath YAML）
#
# 契约（本批裁决 D-3）：**注解是缺省，本文件是可选覆盖**。
# - 只有写了的字段才覆盖；`description` / `inputSchema` 缺省 ⇒ 用 `@Tool` / `@ToolParam` 反射值；
# - 写了 `inputSchema` 就与反射 schema 对账（property 名/类型 + required 集合），漂移即启动失败；
# - `modelName` 缺省 = `toolKey`；`titleKey` 缺省 = `tool.<toolKey>.title`；
# - `status` 缺省视为 published。
#
# 模型侧 description 保持稳定中文单语，不随用户 locale 切换；注解缺省与有效覆盖按语义同步，
# 前端镜像只同步工具边界，不把展示文案当作另一套模型定义。
#
# 改 description 会击穿 prompt 缓存（tools → system → messages 前缀），故将来改描述
# 必须发新 version 并留痕，禁止"保存即生效"式编辑。
# 2026-10-27.2 → 2026-10-27.3（2026-10-28 步骤披露与筛选链路收口）：向导动作按**能成功的步骤**披露，
# set_conditions 只能在 QUERY_COND 调、SELECT_DEFS 下必须先 confirm_step 推进；描述与注解 @ToolScope
# 同批改（披露面与前端 allowSteps 同源），改描述必升 version（破 prompt 缓存）。
# 2026-10-27.3 → 2026-10-27.4（2026-10-28 已知信息复用收口）：用户已明确的配置项/筛选条件与值直接用于工具，
# generative_form 只补真实信息缺口（不用于已知信息、预填确认、取消后自动重问）；描述与注解 @Tool 同批改，
# 改描述必升 version（破 prompt 缓存）。
# 2026-10-27.4 → 2026-10-27.5（2026-10-28 槽位填充 + 条件放行）：表单用途 purpose 显式化
# （SELECT_DEFINITIONS/SET_CONDITIONS/GENERAL_CLARIFY，缺省 GENERAL_CLARIFY），宿主按 purpose 与
# 「任务槽位」判断槽位是否已齐；槽位已确定的收集表单被零副作用拒绝（FORM_SLOTS_ALREADY_KNOWN）。
# 2026-10-27.5 → 2026-10-27.6（2026-10-29 规则冲突统一）：任务已完成（COMPLETED）不再是下载/打开编辑器的
# 理由（只在用户明确意图时调用，状态不是授权）；未设筛选按「全量」呈现（不设条件即全量，不再反复收集条件）。
# 2026-10-27.6 → 2026-10-27.7（2026-10-29 复核返修）：confirm_step 的"失败即停"补第 29 条零副作用一次纠正例外
# （同参数/同目标仍禁），YAML 与 AiTools 注解回落同批；改描述必升 version（破 prompt 缓存）。
# 2026-10-27.7 → 2026-10-27.8（2026-10-29 审核问题 1/2，新建任务口径）：无论任务中心还是已有/已完成任务页面，
# 用户明确要新建导出/导入任务就直接调 create_task（只 type + 可选 title，不先追问配置/文件、不先用
# list_config_defs 摸底）；旧任务的配置/步骤/完成状态不属于新任务（除非用户明确要求沿用）。
# 2026-10-27.8 → 2026-10-27.9（2026-10-29 闭环批：任务类型与筛选条件收集口径）：类型未知必须用
# generative_form(purpose=TASK_TYPE) 的单个 enum 单选（EXPORT/IMPORT），不文字反问；类型已确定时零副作用
# 拒绝并指回 create_task。条件只在 QUERY_COND 用一个非必填自由文本框（longText 可选）收集，留空即全量推进；
# 条件已明确或已到 EXPORT 及之后不再收条件表单（该口径已在 .10 收紧为只在 QUERY_COND，见下条）。
# 描述与注解 @Tool 同批改，version 同步升。
# 2026-10-27.9 → 2026-10-27.10（2026-10-29 返修：条件框只在 QUERY_COND 出现一次）：守卫收成
# 「有明确步骤时只有 QUERY_COND 允许 SET_CONDITIONS」（SELECT_DEFS/EXPORT/DONE/导入链一律零副作用拒绝）；
# 规则 30 / confirm_step / set_conditions 的描述统一为「进入 QUERY_COND 给一次非必填自由文本框，留空直接推进，
# 不得重复收集或文字追问」，删除与规则 26 冲突的「不要为条件弹表单」旧口径。
# 2026-10-27.11 → 2026-10-27.12（Task 1 导出条件与一轮闭环）：confirm_step 增加"禁止 SELECT_DEFS 直接跳 EXPORT"
# 与"条件已知/非空回灌未落库时零副作用拒绝并指回 set_conditions"；generative_form 的条件表回灌非空文本必须先
# set_conditions 落库再 confirm_step（**该条的"落库"表述已被 .17 的草案口径取代**：只形成草案，业务库由前端
# 在下一步/启动作业前提交；历史句保留不改）。改描述必升 version（破 prompt 缓存）。
# 2026-10-27.10 → 2026-10-27.11（2026-10-29 已知信息口径补强）：配置已明确不只看编码 ——
# 中文名称/别名、以及模型已用 list_config_defs / get_config_def 确认过的编码映射同样算已知，
# 确认后直接 select_definitions，不下发选择表单（系统提示词总纲与规则 30 同批改）。
# 2026-10-27.12 → 2026-10-27.13（2026-10-30 元数据协议统一）：工具名的唯一注册定义改为
# AiToolNames（@Tool(name) 与闸门/预检共用）；本文件的 toolKey 是同一名字的声明式镜像，
# ToolRegistry 启动时拒绝指向未注册工具的 toolKey。list_config_defs 描述补"最多前 20 个 + 总数"
# （有界披露与稳定顺序），改描述必升 version（破 prompt 缓存）。
# 2026-10-27.15 → 2026-10-27.16（2026-10-30 条件收集单通道）：EXPORT 创建必须显式给 conditions
# （已知传结构、未决定传 {}）；SET_CONDITIONS 只由宿主发放，真实空对象回灌按明确不设筛选收口。
# 2026-10-27.16 → 2026-10-27.17（2026-10-30 条件草案与提交边界，提示词/文档批）：create_task 的
# defCodes/conditions 只是候选，不在创建时写业务条目；select_definitions/set_conditions 只形成前端草案，
# 业务库只由前端在下一步/启动作业前 persistStepData 提交；confirm_step 认可本轮已结算的结构化草案与
# 留空（明确不设）决定，start_export 预检仍校验业务库最终条件。create_task 恢复「任务中心、已有任务
# 或已完成任务页面都适用」。改描述必升 version（破 prompt 缓存）。
# 2026-10-27.17 → 2026-10-27.18（2026-10-31 有界披露上限上调）：list_config_defs / list_tasks 的
# @Tool 描述上限 20 → 50（截断告知与总条数后缀随 AiTools 常量自动变 50，仍 < result-budget.model.max-rows
# 的 200）；本文件对这两个工具仍只覆盖 title，描述真值在 @Tool 注解。改描述必升 version（破 prompt 缓存）。
# 2026-10-27.18 → 2026-10-27.19（2026-10-31 明确不设筛选的写入口径）：set_conditions 的**恰好空对象** {}
# 是"该配置项明确不设筛选"（前端 condition-payload 落成 "{}"、ConditionAssessment 判 EXPLICIT_UNSET、后端
# WizardActionGuard 放行）；缺失/null/fields:[]/scopeKeys:[] 仍拒绝。用户答"无/不筛选/全部"时，模型对表单
# 覆盖项用一次 set_conditions(items) 批量给出，各项 conditions 均为 {}，不要重发 SET_CONDITIONS；confirm_step 认可逐项
# 结算的空对象草案，拒绝理由只点名仍无草案的剩余项。create_task 的 {} 仍是"条件未决定"，不等于明确不设。
# YAML 与 AiTools 注解、系统提示词同批改，改描述必升 version（破 prompt 缓存）。
# 2026-10-27.19 → 2026-10-27.20（2026-10-31 条件链 fail-closed 收口）：set_conditions 只能对任务已勾选的
# 配置项调用（未勾选/未绑定零副作用拒绝），相同 defCode + 完全相同入参的重复调用幂等复用（不同值=修改照常执行）；
# confirm_step 必须单独成批（混批时零副作用拒绝并要求先单独调用，避免 park 先外置整批历史、吞掉同批调用）；
# 条件收集失败（park 未启用/挂起写失败/读任务异常/条件表未结算）一律零副作用拒绝，不再按全量放行。
# YAML 与 AiTools 注解、系统提示词同批改，改描述必升 version（破 prompt 缓存）。
# 2026-10-27.20 → 2026-10-27.21（2026-11-03 移除预估行数）：预估数据行数工具整体下线（AiTools 注解、
# AiToolNames 注册表、本文件对应 toolKey 三处同批删除）；模型不再有"预估数据行数"这一读取能力。
# 2026-10-27.22 → 2026-10-27.23：AI 精确行数工具下线；REST/UI 的独立计数能力不变。
# 2026-10-27.23 → 2026-10-27.24（2026-11-05 渐进式披露）：表单默认使用基础 Schema，联动按需披露；
# 统一 attachment 白名单；新增当前 run 的非 KB 截断结果有界回读工具。
# 2026-10-27.24 → 2026-10-27.25：披露时保留完整当前 Schema 和联动能力，修正旧描述。
# 2026-10-27.25 → 2026-10-27.26：删除 confirm_step 的“第 29 条”编号引用，直接描述零副作用纠正例外。
# 2026-10-27.26 → 2026-10-27.27：create_task 新增 openWizard；create-only 显式传 false，禁止宿主自动续接。
# 2026-10-27.27 → 2026-10-27.28：明确“创建任务”不等于只创建；默认完整续接，false 仅对应用户明确限定创建后停止。
# 2026-10-27.28 → 2026-10-27.29（2026-11-07 工具描述消歧）：以有效 YAML 冻结并同步 create_task、
# 编辑器/下载、向导步骤和基础只读工具；补齐注解缺省与前端镜像的语义边界，不改工具名、Schema、风险、
# 披露、确认门或执行；改描述必升 version（破 prompt 缓存）。
# 2026-10-27.29 → 2026-10-27.30：create_task 明确直接创建并复用已知配置名/编码和条件；
# 不把 list_config_defs、list_tasks、get_workspace_state 或 get_config_def 作为创建前置，创建不等于启动。
# 2026-10-27.30 → 2026-10-27.31：create_task 禁止任何只读工具作为创建前置；
# 配置编码待确认也先创建，由宿主继续选择/补充。
# 2026-10-27.31 → 2026-10-27.32：创建或配置完成不授权自动启动作业；
