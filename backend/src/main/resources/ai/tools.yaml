# 2026-10-27.33 → 2026-10-27.34：任务 COMPLETED 不单独作为重复导出判据；只有已有成功 EXPORT 作业才禁止重复导出。
# 2026-10-27.34 → 2026-10-27.35：item IMPORTED/任务 COMPLETED 不等于已发布；只有已有成功 PUBLISH 作业才禁止重复发布。
# 2026-10-27.35 → 2026-10-27.36：start_export 按本 run 条目去重；旧任务、openWizard=false 后明确启动及 park 未启用等路径保留模型调用。
# 2026-10-27.36 → 2026-10-27.37（2026-11-13 批量条件协议）：set_conditions 仅接受 items 批量项，
# 整批校验、逐项恢复、完整有序幂等；create_task 非空 conditions 只允许一个 defCode。
# 2026-10-27.37 → 2026-10-27.38：补已知条件直接复用、一次批量明确不设和未勾选整批拒绝的描述。
version: 2026-10-27.38
lang: zh
tools:
  - toolKey: list_config_defs
    title: 列出配置定义
    description: >-
      列出配置定义目录，用于按名称、编码或层级查找定义、确认编码；返回编码、名称、层级和字段数，
      按 sortOrder、code 稳定排序。level 可收窄为 GLOBAL/REGION/PROJECT，省略表示全部层级；
      最多返回前 50 个，超出时给出总数，不把截断清单当作全集。无匹配时返回“没有找到配置定义”。
      已确知编码且需要字段详情时改用 get_config_def；不要用本工具代替创建任务。
  - toolKey: get_config_def
    title: 读取配置定义
    description: >-
      按配置定义编码读取单个定义的字段详情（编码、标签、类型、必填、主键、引用），用于已确知编码后的精确查询。
      code 必填且大小写敏感；编码未知时先用 list_config_defs 查找，不要猜测或改用其他编码。
      找不到时返回结构化 not-found；本工具只读，不修改定义，也不代替创建任务。
  - toolKey: list_tasks
    title: 列出任务
    description: >-
      列出最近的任务，用于查找已有任务、核对任务类型、当前步骤和状态；返回任务 ID、标题、类型、步骤和状态，
      最多返回前 50 条，超出时给出总条数，不把截断清单当作全集。没有任务时返回空结果提示。
      已知任务上下文且需要工作区快照时改用 get_workspace_state；查询作业进度改用 check_job_status。
      本工具只读，不创建任务、不启动作业。
  - toolKey: get_workspace_state
    title: 读取工作区状态
    description: >-
      读取当前工作区绑定任务的状态快照，返回任务 ID、标题、类型、当前步骤、状态及已选配置项状态。
      任务上下文由宿主提供；未打开任务时返回提示，不自动创建或选择任务。
      需要查找已有任务时改用 list_tasks；需要作业进度时改用 check_job_status。本工具只读，不推进步骤或启动作业。
  - toolKey: check_job_status
    title: 查询作业状态
    description: >-
      按作业 ID 查询单个已有作业的类型、状态、进度和错误数，用于作业启动后的状态核对。
      jobId 必须来自已启动作业返回的作业编号或已有作业信息，不要用任务 ID 代替。
      本工具只读，不启动、取消或重试作业，也不表示导出文件已经下载；任务步骤改用 list_tasks 或 get_workspace_state。
  - toolKey: create_task
    title: 创建任务
    description: >-
      用户明确要新建导出/导入任务时直接调用 create_task（任务中心、已有任务或已完成任务页面都适用）：
      已知配置名/编码和条件直接复用，不要先追问配置项、筛选条件或数据文件；
      不得以任何只读工具作为创建前置，包括 list_config_defs 和 get_config_def；
      即使需要确认配置编码也先创建任务，由宿主继续选择/补充。
      需要任务类型 type（EXPORT/IMPORT）、可选 title、可选 defCodes；EXPORT 还必须显式传 conditions：
      非空已知条件只允许一个 defCode；未决定传 {} 且可保留多个 defCodes（这里的 {} 只表示条件未决定，
      不是 set_conditions 的“明确不设”），不得省略。不同配置项的不同条件在创建后用 set_conditions(items) 给出。
      defCodes/conditions 只是候选（只存在会话/Redis 里，随会话失效）：创建时只建任务，不写配置项勾选、不写条件条目，也不改业务库条件。
      只有用户已明确配置定义（编码/中文名/别名）时才传 defCodes；未提就省略，宿主随后只弹一次配置项选择表单。
      条件已知（对话里已给）时由前端 set_conditions 形成草案，宿主不再弹条件表；条件未知时宿主只给一次
      非必填自由文本框，留空即明确不设筛选，下一步提交 {}。条件表单由宿主统一发放，模型不得自行调用
      SET_CONDITIONS 表单。标题不追问，缺省按类型生成；类型无法判断时才用 TASK_TYPE 表单。
      旧任务状态不自动带入。前置：确认卡批准后才会创建；同一轮最多一次；创建不等于启动。
      “创建任务”只是流程入口，不等于“只创建”；未明确要求限制后续配置、打开或启动时，默认完整续接，openWizard 省略或传 true。
      只有用户明确把本次意图限定为创建后停止（不继续配置、不打开向导、不启动后续流程）时，才传 openWizard=false；
      宿主不得自动导航、代选或发配置表单，返回任务 id 后即可收尾；以后明确打开/配置仍可继续。
      原始意图是完整导出/导入时，批准后继续用 navigate_to(page=..., taskId=...) 打开向导，
      在同一 run 连续完成所需配置/条件和启动确认，批准后再真实执行；SUSPENDED 不得提前 DONE。
      本 run 已有 start_export 条目时不得重复调用；旧任务、openWizard=false 后明确启动、park 未启用或宿主未生成条目时，
      模型仍按披露调用 start_export；导入仍按披露调用相应启动工具。
      不得要求用户另发一轮开始或执行；启动确认不可绕过，只有用户明确只创建/创建后停止时才允许创建后收尾。
  - toolKey: start_export
    title: 启动导出作业
    description: >-
      启动配置导出作业（需要用户确认）。前置：EXPORT 任务已选配置项；CANCELLED 任务不得启动，
      已有成功 EXPORT 作业不得重复导出；任务 COMPLETED 本身不能替代 EXPORT 作业状态，
      不得仅凭任务状态拒绝其他合法启动；无同类在途作业。下载或打开编辑器只在用户明确要求时进行（已完成状态本身不是授权）。
  - toolKey: start_precheck
    title: 启动预检查作业
    description: >-
      启动预检查作业（需要用户确认）。前置：IMPORT 任务已选配置项且已上传数据文件；无在途作业。
  - toolKey: start_import
    title: 启动导入作业
    description: >-
      启动导入作业（需要用户确认）。前置：IMPORT 任务有上传文件，且最近一次预检查通过且未过期；无在途作业。
  - toolKey: start_publish
    title: 启动发布作业
    description: >-
      启动发布作业（需要用户确认，不可撤销）。前置：IMPORT 任务、最近一次预检查通过且无同类在途作业；
      item IMPORTED 或任务 COMPLETED 不等于已发布，只有已有成功 PUBLISH 作业才禁止重复发布，
      不得仅凭这些状态拒绝合法 start_publish；发布模式由任务设置决定（MERGE/REPLACE），以确认卡上的权威值为准，不以对话文本为准。
  - toolKey: open_export_file_editor
    title: 打开导出文件在线编辑器
    description: >-
      打开指定配置项的导出文件在线编辑器（前端执行），用于查看或编辑既有文件；不下载文件，也不启动新的导出。
      前置：EXPORT 任务已有成功导出作业/导出文件。只在用户明确提出查看/编辑导出文件意图时调用；
      只要保存到本机时改用 download_export_files。任务已完成（COMPLETED）本身不是授权，
      不要把它当作已完成任务的下一步建议。返回前端打开结果，不把已打开等同于编辑已保存。
  - toolKey: download_export_files
    title: 下载导出文件
    description: >-
      下载指定配置项的既有导出文件（前端执行）：1 个编码直出单文件 xlsx，2 个及以上编码打包为单个 zip；
      不打开在线编辑器，也不启动新的导出。前置：EXPORT 任务已有成功导出作业/导出文件。
      只在用户明确提出下载/获取文件意图时调用；查看/编辑时改用 open_export_file_editor。
      任务已完成（COMPLETED）本身不是授权，不要用它替代 start_export，也不要仅凭状态自动下载。
      浏览器下载结局未确认时如实说明，不把已发起当作已保存。
  - toolKey: navigate_to
    title: 跳转页面
    description: >-
      跳转页面并绑定任务（前端执行）。前置：目标页面存在；create_task 返回任务 id 后用它打开该任务向导。
      只打开任务时，页面、任务绑定与详情就绪后即可收尾；完整执行时下一批按最新披露继续，
      不要在同一批里并排调用后续动作。同一目标页不要重复导航。
  - toolKey: select_definitions
    title: 选择配置项
    description: >-
      在工作区勾选配置项（前端执行，勾选只形成前端草案，业务库由前端在下一步/启动作业前提交）。前置：已打开对应导出/导入向导并绑定 taskId，
      且当前在「选择配置」步（导出 SELECT_DEFS / 导入 UPLOAD）—— 只在它被披露的步骤调用。
      选择项优先用本工具，不要用开放式文字询问。用户已明确配置定义时直接调用，不用表单重复询问（编码、中文名称/别名、或已用 list_config_defs / get_config_def 确认的映射都算已明确）。
      勾选后不要声称已写入业务库：确认与提交由下一步（confirm_step）完成。
  - toolKey: set_conditions
    title: 设置查询条件
    description: >-
      批量设置导出查询条件草案（前端执行，不写业务库）。items 是 1..N 非空数组，每项仅 defCode/conditions，
      defCode 不得重复，每项必须显式携带 conditions；不同配置项可给不同字段和条件。
      已知条件直接使用；所有项都通过定义、字段、算子、取值和任务选中校验后才整批下发；任一项失败则整批零写入、零草案。
      未勾选/未绑定任一项也整批拒绝。明确不设时用一次 set_conditions 的 items 覆盖每个 defCode，
      各项 conditions 都传恰好空对象 {}，不要重发 SET_CONDITIONS；缺失、null、fields:[]、scopeKeys:[] 均被拒绝。
      只有完整有序 items 完全相同的调用才幂等复用；任一项、条件或顺序变化都是新修改，迟到旧回执不得覆盖。
      前置：EXPORT 任务且当前在 QUERY_COND 步骤；条件已给出（含条件文本框回填后解析出的条件）时才调用。
      设置后由前端在 confirm_step 或启动作业前 persistStepData 提交业务库，不得声称已落库/已生效。
      若当前是 SELECT_DEFS，先单独 confirm_step 到 QUERY_COND，下一批再调用本工具。
  - toolKey: confirm_step
    title: 确认步骤
    description: >-
      确认并推进向导步骤（前端执行），需已导航到导出/导入向导；本工具只推进步骤，不启动作业。
      默认不传 step，只前进一步；step 仅在用户点名目标步骤或明确要求跳过筛选时才传，
      合法目标步骤仍须完成必经步骤，不要擅自跳步。前置：当前步骤校验通过。只推进到目标步骤时，
      目标达成即可收尾；完整执行时下一批按最新披露继续（不要在同一批里连续推进）；推进失败即停，如实说明原因与当前步骤，
      不要重试推进或跳步（回执给出明确纠正指引且本次零副作用时，
      允许一次不同的纠正动作；同参数/同目标仍在禁止之列）。step 的合法枚举：导出向导 SELECT_DEFS/QUERY_COND/EXPORT；
      导入向导 UPLOAD/PRECHECK/IMPORT/PUBLISH（导入没有 SELECT_DEFS 步）。
      用户已提出筛选条件时也照此推进：先到 QUERY_COND，下一批再 set_conditions。
      禁止从 SELECT_DEFS 直接跳到 EXPORT（那条路会跳过 QUERY_COND 与条件收集，会被宿主零副作用拒绝）；
      即使传 step，也必须先完成 QUERY_COND 才能推进到 EXPORT。
      未设筛选是正常状态（= 全量导出）：进入 QUERY_COND 后不要自行下发 SET_CONDITIONS 表单；
      条件未决定时由宿主统一给一次非必填自由文本框（只此一次，留空即明确不设筛选并照常推进），不要重复收集或用文字追问。
      条件已知但还没有草案、或条件表回灌了非空文本却还没 set_conditions 时，confirm_step 会被零副作用拒绝
      并指回 set_conditions：先形成草案，下一批再推进（业务库由前端在本步提交，模型不写库）。
      本步认可本轮已结算的结构化草案（含逐项 set_conditions(items=[{defCode, conditions: {}}]) 的明确不设）与"留空=明确不设"的决定；
      本工具必须单独成批：同一批里还有其它工具时会被零副作用拒绝并要求先单独调用 confirm_step
      （条件表需要单独一张卡；混批挂起会先外置整批历史、吞掉同批其它调用的卡与回执）；
      start_export 预检仍校验业务库里的最终条件。
  - toolKey: generative_form
    title: 生成式表单
    description: >-
      在对话内渲染结构化表单并等待用户填写，只用于真实信息缺口，不用于已知信息、预填确认或取消后自动重问。
      purpose 必须对应实际用途。TASK_TYPE 只在类型未知时使用单个 EXPORT/IMPORT 单选；SET_CONDITIONS 由宿主统一发放，
      模型不得自行调用。配置项已明确时直接使用 select_definitions。字段类型统一为
      text/number/boolean/date/enum/multi_select/attachment，禁止 HTML、脚本和自定义属性；attachment 只能由用户上传，
      不得预填。披露时保留完整当前 Schema 和联动能力，高级联动仍受后端白名单与闭集数据源校验。
      表单只收集值，不推进向导步骤；
      用户提交后的字段值在统一信封 message 中，取消为 outcome=cancelled，schema 不合规则 rejected 且未下发。
  - toolKey: read_tool_result
    title: 读取截断工具结果
    description: >-
      按 toolCallId 分页读取本轮被截断的非 KB 工具结果。offset 从 0 开始，maxChars 默认 4000、范围 2..8000；
      返回 originalChars/returnedChars/nextOffset/content，nextOffset 非空时用它续读。
      只能读取当前 run、当前身份下的既有台账；KB 结果继续使用 kb_read_doc 原生分页。
  - toolKey: read_sheet_summary
    title: 读取表格摘要
  - toolKey: aggregate_sheet
    title: 聚合表格
  - toolKey: inspect_columns
    title: 诊断列映射
  - toolKey: review_cells
    title: 本地校验摘要
  - toolKey: find_rows
    title: 查找所在行
  - toolKey: normalize_column
    title: 列归一化
  - toolKey: replace_values
    title: 查找替换
  - toolKey: update_rows
    title: 条件更新行
  - toolKey: undo_last_sheet_edit
    title: 撤销 AI 表格修改
