server:
  port: 8081
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 120000

spring:
  application:
    name: config-mgr

  threads:
    virtual:
      # DC-12：禁用虚拟线程（N3 裁决，第二棒执行）。全局翻转 ⇒ 业务 @Async（作业执行）
      # 与 AI 运行时都跑平台线程：作业侧见 config/AsyncConfig（有界池 4/16 + 队列 200），
      # AI 侧见 ai/exec/AiExecutorConfig（挂起专用有界池，饱和 503 SUSPEND_POOL_SATURATED）。
      enabled: false

  datasource:
    url: jdbc:h2:file:./data/config_mgr_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Redis：AI 会话记忆外置（S4.2 M2）。Memurai 兼容，只用到普通数据结构（LIST/SET/EXPIRE）。
  # R4 裁决：连接/命令超时收紧到 2s —— Redis 不可用时 AI 端点由 RedisAvailability 前置探活
  #   直接 503 AI_REDIS_UNAVAILABLE（≤2s），不再让 5 次串行 Redis 操作各等 3s（实测 15.1s）。
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms

  # ── S4.2 AI Runtime：OpenAI 兼容全配置化（DC-01）──────────────────────────
  # 密钥只经环境变量注入，绝不写入版本库；变量名统一 AI_API_KEY，兼容 DEEPSEEK_API_KEY 兜底。
  # Q2：key 为空时后端仍正常启动——模型侧 bean 由 AiModelConfig 条件化装配（无 key 不建 bean，
  #     AI 端点惰性降级 503 AI_UNAVAILABLE），业务 API 与 CI 不依赖 key。
  ai:
    model:
      # 关闭 Spring AI 各类型模型的自动配置：OpenAI 自动配置在 key 为空时 Assert 失败会中断启动
      # （OpenAIAutoConfigurationUtil.resolveConnectionProperties），本项目只需要 ChatModel。
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        # ChatClient 改由 AiModelConfig 从 ChatModel 组装（挂 MessageChatMemoryAdvisor）
        enabled: false
    openai:
      api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        # 注意：DeepSeek 的接口路径是 /chat/completions（无 /v1 前缀），
        # 必须覆盖默认的 /v1/chat/completions，否则请求 404。
        completions-path: /chat/completions
        options:
          model: ${AI_MODEL:deepseek-flash}
          temperature: 0.2
          max-tokens: 4096
          # 让流式最后一块回传 token 用量（done 终帧 usage 的来源）
          stream-usage: true

app:
  # ── S4.2 规格 §4 配置键表（app.ai 只由 ai/config/AiProperties 绑定；基座那套
  #    max-iterations/session-ttl-minutes/hitl-timeout-minutes/thinking-disabled 已删除，
  #    其中 thinking-disabled 在新运行时早已失效：官方循环 + reasoning 补丁不设 extraBody.thinking）──
  ai:
    session-ttl: 6h
    memory:
      max-messages: 40
    hitl:
      # 确认门/前端工具挂起的等待上限（ADR-2 上限约束；超限自动取消，工具不执行）
      timeout: 120s
    suspend:
      # 挂起专用有界平台线程池（DC-12 禁虚拟线程）；容量即挂起并发上限，队列为 0 ⇒ 饱和快速失败 503
      pool-size: 20
    resilience:
      # 双超时 + 有界重试 + 总预算（韧性棒落地：run/StreamWatchdog）。
      # 三个阈值均为初值，待技术方案 §13.2 #2 压测裁决（【待裁决】见 S42-P3 证据文档）。
      # 硬规范①：超时阈值 > 最长工具耗时 —— 挂起等待（确认门）期间工具处于"活跃"，
      #   看门狗在工具执行期间不计静默、退出后以退出时刻重新计时，故 90s < hitl.timeout(120s) 仍正确；
      #   "配置值本身要不要直接大于 hitl.timeout"列为待裁决。
      # 硬规范②：TCP 静默 FIN 按断流处理 —— 正常收尾必须有终帧（finishReason/usage），
      #   缺失即判 UPSTREAM_STREAM_INCOMPLETE 并进入重试三条件判定。
      first-byte-timeout: 30s
      inter-event-timeout: 90s
      max-attempts: 2
      total-budget: 300s
    resume:
      # N3/N8：应用启动自动续跑（扫描 RunStore 后自动 resume）。
      # 仅续"已有人类结论/无外部输入需求"的轮次；仍 PENDING 的确认门/前端工具一律跳过（不绕开人审）。
      on-startup: true
      startup-delay: 8s
      zombie-age: 60s
      max-on-startup: 10
      # T3-6a：死卡兜底的"轻量执行器"（确认门 woke=false 且快照 SUSPENDED 时触发续跑）。
      # 容量小 + 队列有界 + 饱和拒绝：resume 内部还会向挂起池提交一次，同池提交即嵌套占用。
      trigger-pool-size: 2
      trigger-queue-capacity: 16
    session:
      lock:
        # ADR-5：会话锁 TTL = 轮上限；watchdog 续期；轮终态主动释放
        ttl: 10m
        watchdog: 30s
    tool-result:
      # DC-14 T2（R10-1）：工具结果**回填模型**前的上限（行数/字符数）——防上下文爆炸。
      # 只约束"给模型看的"那一份：前端 tool_result 帧与 Redis 台账始终是全文。
      # 初值依 R10-1 建议（200 行 / 8000 字符），实际取值随 §13.2 #9 压测复核。
      max-rows: 200
      max-chars: 8000
    frame:
      # T3-10 裁定：SSE 单帧 JSON 的 UTF-8 字节上限 64KB（判定=整帧字节数；
      # 超限对 text/result 做**字段级**截断 + truncated/truncatedReason 标记，严禁字节级截断）。
      # 该上限**优先于** T2"给前端看的帧全文不裁剪"的承诺（A21 口径变更），
      # 修订落在 ToolResultLimiter javadoc 与 com.example.configmgr.ai.run.FrameSizeLimiter。
      max-bytes: 65536
  job:
    demo-batch-delay-ms: 300
    batch-size: 100
  file:
    storage-path: ./data/files
  server:
    backend-port: 8081
    frontend-port: 5173

logging:
  level:
    com.example.configmgr: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
