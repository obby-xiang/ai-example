server:
  port: 8081
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 120000

spring:
  application:
    name: config-mgr

  threads:
    virtual:
      # DC-12：禁用虚拟线程（N3 裁决，第二棒执行）。全局翻转 ⇒ 业务 @Async（作业执行）
      # 与 AI 运行时都跑平台线程：作业侧见 config/AsyncConfig（有界池 4/16 + 队列 200），
      # AI 侧见 ai/exec/AiExecutorConfig（挂起专用有界池，饱和 503 SUSPEND_POOL_SATURATED）。
      enabled: false

  messages:
    # 只两份（zh / en）：区域变体靠 messages_zh_CN → messages_zh → messages 链回落。
    # 兜底口径见 common/ErrorBodyFactory：zh 一律用调用方原文（E2E 中文断言逐字不变），
    # en 才查 error.<CODE>；缺键回落原文，绝不回显裸 key。
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    cache-duration: 3600

  datasource:
    url: jdbc:h2:file:./data/config_mgr_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # 连接池上限维持 10（2026-10-10 数字规格清点裁决④：值不动、补依据）—— 本值不是新值。
      # 依据 = 业界依据 §7「数据库连接池（HikariCP）」：官方默认 maximumPoolSize = 10，
      # 且官方明确"不要按并发数放大池子"（连接多了会可测量地拖慢性能）；内网小用户量、
      # 单实例下默认值即推荐值。
      # 改本值须知连带看：config/AsyncConfig 的业务作业池上限（16）大于本上限时，超出的作业线程
      # 会在 Hikari connectionTimeout 内排队；两个数须一并复核（见该类"已知张力"注释）。
      # minimumIdle 刻意不设 —— 同节官方建议不设（默认 = maximum-pool-size，让池表现为固定大小）。
      # 本项取框架缺省 10（= HikariCP 官方默认 maximumPoolSize），不显式写出；如需调剂再显式加回。

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Redis：AI 会话记忆外置（S4.2 M2）。Memurai 兼容，只用到普通数据结构（LIST/SET/EXPIRE）。
  # R4 裁决：连接/命令超时收紧到 2s —— Redis 不可用时 AI 端点由 RedisAvailability 前置探活
  #   直接 503 AI_REDIS_UNAVAILABLE（≤2s），不再让 5 次串行 Redis 操作各等 3s（实测 15.1s）。
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms

  # ── S4.2 AI Runtime：OpenAI 兼容全配置化（DC-01）──────────────────────────
  # 语义变更（模型配置专项批①，2026-10-21）：本节三键不再只是"运行时唯一真相"，而是
  #   ① 首次种子来源（ai_provider 空表时由 AiConfigSeeder 写 1 行 provider + 1 行模型）；
  #   ② 缺省参数来源（AiProviderRegistry 以 spring.ai.openai.chat.options 作默认选项基底）。
  # DB（ai_provider/ai_model）建好后 DB 是真源，env 只作种子（strict seed：表非空 ⇒ env 不参与）。
  # key 有两条路：key_ref=ENV（运行时从本键现读，env key 不落库）或 key_ref=DB（库里存密文，
  #   信封 v1.<kid>.<iv>.<ct+tag>，KEK = 环境变量 AI_SECRET_KEK base64 32B，缺失即 fail-closed）。
  # Q2（现状保留）：无可用 provider 时后端照常启动 —— 模型侧 bean 改为无条件装配 + 调用时动态判空
  #     （AiAvailability），AI 端点惰性降级 503 AI_UNAVAILABLE，业务 API 与 CI 不依赖 key。
  ai:
    model:
      # 关闭 Spring AI 各类型模型的自动配置：OpenAI 自动配置在 key 为空时 Assert 失败会中断启动
      # （OpenAIAutoConfigurationUtil.resolveConnectionProperties），本项目只需要 ChatModel。
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        # ChatClient 由 AiProviderRegistry 按 provider 组装（挂 MessageChatMemoryAdvisor）
        enabled: false
    openai:
      api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        # 注意：DeepSeek 的接口路径是 /chat/completions（无 /v1 前缀），
        # 必须覆盖默认的 /v1/chat/completions，否则请求 404。
        completions-path: /chat/completions
        options:
          model: ${AI_MODEL:deepseek-flash}
          temperature: 0.2
          max-tokens: 4096
          # 让流式最后一块回传 token 用量（done 终帧 usage 的来源；换 provider 也不许丢）
          stream-usage: true

app:
  # ── S4.2 规格 §4 配置键表（app.ai 只由 ai/config/AiProperties 绑定；基座那套
  #    max-iterations/session-ttl-minutes/hitl-timeout-minutes/thinking-disabled 已删除，
  #    其中 thinking-disabled 在新运行时早已失效：官方循环 + reasoning 补丁不设 extraBody.thinking）──
  ai:
    # ── 模型配置读写开关（模型配置专项批①）─────────────────────────────────
    config:
      # 强制重灌 env 种子（默认 false = strict seed：表非空时 env 完全不参与）。
      # 打开后只刷新"来源=ENV_SEED"的行（用户改过的行不动）。改本键需重启。
      seed-force: false
      # 读路径版本比对的最小间隔：稳态至多 1 次/秒/实例（Redis ai:cfg:ver，不可用时退化为本地版本）。
      reload-interval: 1s
      # URL 闸（SSRF，模型配置专项批②）：写路径只接受 http/https 绝对地址、禁内嵌凭据；
      # 默认**禁**私网/回环/云元数据（169.254.169.254）。打开本键 = 允许应用去打内网，
      # 仅在"内网自建 OpenAI 兼容网关 / E2E 桩"时显式打开（种子行 source=ENV_SEED 不受本键约束）。
      allow-private-endpoints: false
      # /test 与 /models/fetch 的单次上游超时（人点按钮等结果的同步动作，按 5s 而不是聊天预算取值）。
      probe-timeout: 5s
      # 拉取到的远端模型清单缓存（Redis ai:cfg:models:<providerId>；不落库）。
      models-cache-ttl: 10m
    # 会话滑动 TTL（2026-10-20 用户裁决第 4 条：6h → 24h，活跃即续、整个会话维度、无绝对上限）。
    # run 级外置键（快照/待决/台账/帧/序号/心跳）同取本值，每次写/心跳都整额续期。
    session-ttl: 24h
    memory:
      max-messages: 40
    # ── 上下文计量与压缩（上下文统计与压缩专项批①；设计稿 §3.7）────────────────
    # 每个数字的依据逐行登记在 docs/evidence/补档-NUMSPEC-清单总账.md（禁裸数字）。
    # 启动期校验见 AiProperties#verifyContext（reserve >= limit、阈值倒挂、冷却为 0 等一律 fail-fast）。
    context:
      # 分母的过渡键。模型配置专项的 ai_model.max_context 落地后由它覆盖
      #（唯一消费点 = context/ContextLimitResolver）；0 = 主动声明未知（降级态：不显示百分比、不做比例压缩）。
      limit-tokens: 128000
      # 预留缓冲（调研 §① Claude Code 的 13K）：覆盖 max-tokens 4096 的输出空间 + 一轮工具回环余量。
      # 比例阈值对 (limit - reserve) 取比 ⇒ 128K 下 L3@95% 仍剩 5.75K > 4096。
      reserve-tokens: 13000
      # 压缩谱系的三条触发线（对 limit - reserve 的百分比；调研 Q2 区间 70–75 / 80–85 / 95 取中值）。
      # 逐级触发：L1 → L2 → L3，每次最多升一级（批③ 已实现 L2/L3）。
      l1-percent: 70
      l2-percent: 80
      l3-percent: 95
      # 滞回（调研 Q4）：压缩到 used/limit < 60% 才允许再次触发 —— 防"压一次不够、立刻再压"的抖动链。
      hysteresis-percent: 60
      # pin：最近 5 对工具结果不清（调研"保留最近 3–5 对"取上限 = 保守）。
      keep-tool-pairs: 5
      # pin：最近 6 轮逐字保留（调研"保留最近 6–8 轮"取下限 = 省 token 优先；批③ 已消费）。
      keep-recent-turns: 6
      # 摘要分块（必须小于 reserve-tokens：保证摘要请求自身不越窗；批③ 已消费）。
      chunk-tokens: 8000
      # 一次摘要请求的硬上限（批③ 已消费）：失败即走熔断，不回退到"静默截断"。
      summary-timeout: 60s
      # 熔断（批③ 已消费）：连续 3 次失败 open；冷却 10m 后半开重试一次。
      fuse-threshold: 3
      fuse-cooldown: 10m
      # 摘要模型：空 = 主模型（D3 裁决）；模型配置的 provider 表落地后可只改本键切换。
      summary-model: ""
    hitl:
      # 挂起等待上限（2026-10-20 用户裁决第 1/2 条后只剩一个键）：
      #   confirm-timeout（确认门，等人）**已退役**：确认门不再超时，一直等到用户批准/拒绝/取消。
      #   frontend-tool-timeout（等机器）：**只**管即时执行类前端工具（navigate_to 等）的后端回执兜底；
      #     generative_form 不读本键（等的是人填表，无上限）。
      #     依据 = 业界依据 §6：MCP 只规定 SHOULD 设超时；实现层默认常见 60s，Vercel AI SDK
      #     toolMs 区间 5–60s。**本键维持 120s**：降到 60s 会把前端执行器预算折算压到
      #     5s 下限（frontend/src/utils/frontend-tools.ts 的"预算 = 服务端上限 − 回灌 POST 60s"，
      #     该文件自述 ≤65s 为病态配置，而实测最慢成功回灌 30.6s）—— 降到 60s 的前置 = 前端折算面
      #     （回灌 POST 单独给更短上限）专项（数字规格清点 P-1 / 等待治理 R-99②），本次不动。
      frontend-tool-timeout: 120s
    suspend:
      # 挂起专用有界平台线程池（DC-12 禁虚拟线程）；容量即挂起并发上限，队列为 0 ⇒ 饱和快速失败 503
      pool-size: 20
    resilience:
      # 双超时 + 有界重试 + 总预算（韧性棒落地：run/StreamWatchdog）。
      # 三个阈值均为初值，待技术方案 §13.2 #2 压测裁决（【待裁决】见 S42-P3 证据文档）。
      # 硬规范①：超时阈值 > 最长工具耗时 —— 挂起等待期间工具处于"活跃"，
      #   看门狗在工具执行期间不计静默、退出后以退出时刻重新计时，故 90s 小于等待上限仍正确；
      #   确认门与 generative_form 已无等待上限（2026-10-20 裁决），不再参与本条。
      # 人机预算分离（裁决第 3 条）：total-budget 的判据 = 墙钟 − 挂起等待，等人时间不计入。
      # 硬规范②：TCP 静默 FIN 按断流处理 —— 正常收尾必须有终帧（finishReason/usage），
      #   缺失即判 UPSTREAM_STREAM_INCOMPLETE 并进入重试三条件判定。
      first-byte-timeout: 30s
      inter-event-timeout: 90s
      max-attempts: 2
      total-budget: 300s
    resume:
      # N3/N8：应用启动自动续跑（扫描 RunStore 后自动 resume）。
      # 仅续"已有人类结论/无外部输入需求"的轮次；仍 PENDING 的确认门/前端工具一律跳过（不绕开人审）。
      on-startup: true
      startup-delay: 8s
      zombie-age: 60s
      max-on-startup: 10
      # T3-6a：死卡兜底的"轻量执行器"（确认门 woke=false 且快照 SUSPENDED 时触发续跑）。
      # 容量小 + 队列有界 + 饱和拒绝：resume 内部还会向挂起池提交一次，同池提交即嵌套占用。
      trigger-pool-size: 2
      trigger-queue-capacity: 16
    session:
      lock:
        # 会话锁的有效期（超时面治理批① 第 8③ 项订正自述）：这是**互斥窗口上界**，不是"轮上限"——
        #   轮预算 = app.ai.resilience.total-budget(300s)；锁 TTL 约束的是"持锁进程死后多久别人能接管"，
        #   由 watchdog(30s) 续期、轮终态主动释放，两者无等式关系。
        ttl: 10m
        watchdog: 30s
    # ── 代码缺省键（本文件**不显式写出**：值取 @ConfigurationProperties 字段初值；改键须同改出处）──
    # 键                                  缺省值  出处（backend/src/main/java/.../ai/config/AiProperties.java）
    # app.ai.lease.ttl                     30s     Lease#ttl（:567）   续跑权有效期 = 续租间隔 ×3
    # app.ai.lease.renew-interval          10s     Lease#renewInterval（:570）  持有者续租间隔（TTL/3）
    # app.ai.lease.retry-delay             35s     Lease#retryDelay（:573）     抢租失败退避（TTL + 5s 余量）
    # app.ai.lease.resource-ttl            60s     Lease#resourceTtl（:588）    L1 资源互斥锁有效期（不续租）
    # app.ai.lock.enabled                  true    Lock#enabled（:603）         资源互斥总开关（关掉只该用于单实例对照）
    # app.ai.sse.delivery-pool-size        8       Sse#deliveryPoolSize（:479） 共享投递池线程数（T3-5 压测定值）
    # app.ai.sse.delivery-queue-capacity   256     Sse#deliveryQueueCapacity（:506）  每订阅者实时队列容量
    # 说明：这 7 个键此前只活在代码里（配置面 grep 不到），运维无从发现"租约 30s / 续租 10s"这类
    #   时间口径；**本段只做显化，不写出值**（写出来就等于给配置面加了第二份事实源，改键要改两处）。
    tool-result:
      # DC-14 T2（R10-1）：工具结果**回填模型**前的上限（行数/字符数）——防上下文爆炸。
      # 只约束"给模型看的"那一份：前端 tool_result 帧与 Redis 台账始终是全文。
      # 初值依 R10-1 建议（200 行 / 8000 字符），实际取值随 §13.2 #9 压测复核。
      max-rows: 200
      max-chars: 8000
    input:
      # 安全防护专项批① 闸门 1（界面 §5.1 #1；数据最小化 R5）：单条 message 的字符上限。
      # 判据 = UTF-16 码元数，与前端 <textarea maxlength> / JS String#length **同一把尺**
      #   ⇒ 8192 个汉字（24576 字节）照常放行，中文不会被 UTF-8 字节数提前判死。
      # 超限 **400 MESSAGE_TOO_LONG 拒绝**，不截断（裁决 A1：截断会让模型基于半句话下结论）。
      # 取值 8192 = 与工具结果回填上限（tool-result.max-chars 8000）同量级：超过它就不再是"一句话需求"。
      max-chars: 8192
    limit:
      # 安全防护专项批① 闸门 3：POST /api/ai/chat 的滑动窗口限流（Redis 单键 Lua 原子）。
      # 键族 ai:rate:session:<sessionId> / ai:rate:ip:<RemoteAddr>（窗口外成员在同一脚本里回收）。
      # session-per-minute：sessionId 由客户端自生 ⇒ 只拦"同页签被脚本连发"（20 次/分已远超手速）；
      # ip-per-minute：兜住"换 sessionId 绕会话额度"；E2E 全程 21 次 /chat，不会被误伤。
      # Redis 计数不可用 ⇒ 降级放行 + WARN（限流是防滥用，不是准入前提）。
      session-per-minute: 20
      ip-per-minute: 60
      window: 1m
    frame:
      # T3-10 裁定：SSE 单帧 JSON 的 UTF-8 字节上限 64KB（判定=整帧字节数；
      # 超限对 text/result 做**字段级**截断 + truncated/truncatedReason 标记，严禁字节级截断）。
      # 该上限**优先于** T2"给前端看的帧全文不裁剪"的承诺（A21 口径变更），
      # 修订落在 ToolResultLimiter javadoc 与 com.example.configmgr.ai.run.FrameSizeLimiter。
      max-bytes: 65536
    sse:
      # 包②：SSE 写侧超时预算（ai/run/SseChatEmitter + common/sse/SseWriteBudget）。
      #   delivery-pool-size / delivery-queue-capacity：T3-1 的投递池与每订阅者实时队列
      #     （值取代码缺省 8 / 256，不显式写出）。
      #   write-timeout：**单帧写出**的超时预算 —— 写出挪到弹性写出池（sse-write-*），
      #     投递池线程最多等本值；超预算即摘除该订阅者（主动断连，前端 onerror/onclose
      #     带 lastSeq 重挂差量补发，不静默丢帧）。整条流的寿命**不设传输层死线**
      #     （AiController 用 new SseEmitter(-1L)：确认门/表单等人工输入没有上限；
      #     机器预算 total-budget=300s 仍由 StreamWatchdog 判，与传输层无关）。
      #     **必须 > 0**（启动期 fail-fast 校验，见 AiProperties）：0/负值会被 SseWriteBudget
      #     静默回落成缺省 15s（配置面与运行面说两套话），故启动期直接失败 —— 与任务通道
      #     app.task.sse.write-timeout 同款守卫。
      #   实测依据（18330 本机 + tomcat-embed-core 10.1.54 字节码反证；2026-10-10 复核后更正口径）：
      #     写侧**并非无超时** —— NioEndpoint#setSocketOptions 会 setWriteTimeout(getConnectionTimeout())，
      #     即写超时 = server.tomcat.connection-timeout（本配置 120s），实测不读的客户端 ≈116s 才被这条
      #     写超时以 SocketTimeoutException 释放；它随连接配置漂移，是 15s 预算的 ≈8 倍宽。
      #     故本包的价值 = 把写侧预算收紧到 15s + 消除锁内写 + 消除投递池/调用线程占用（详见包②施工报告 §实测）。
      write-timeout: 15s
  task:
    sse:
      # 包②：任务级 SSE 通道（GET /api/tasks/{id}/events）的写侧预算，与 app.ai.sse 同口径。
      #   write-timeout：单帧写出预算（15s，与 AI 通道同一缺省来源 SseWriteBudget#DEFAULT_TIMEOUT_MILLIS）；
      #     **必须 > 0**（启动期 fail-fast 校验，见 AppProperties）：0/负值会被 SseWriteBudget
      #     静默回落成缺省 15s（配置面与运行面说两套话），故启动期直接失败。
      #   emitter-timeout：订阅者生命周期超时，**必须 > 0**（启动期 fail-fast 校验，见 AppProperties）。
      #     原为 SseEmitter(0L) = 该 emitter 没有生命周期超时 —— 但这不等于"连接没有释放手段"：
      #     上面那条 120s 容器写超时仍在，只是它随连接配置漂移、通常比生命周期超时更早到。
      #     5m 是任务通道自己的流寿命口径（AI 通道自 P1 起不设传输层死线：new SseEmitter(-1L)，
      #     因为确认门/表单等人没有上限；机器预算仍由 StreamWatchdog 判）。
      #     前端 EventSource 会按 retry 自动重连，job-watch 的快照轮询兜底。
      write-timeout: 15s
      emitter-timeout: 5m
  job:
    demo-batch-delay-ms: 300
    batch-size: 100
    # ── 作业看门狗（R-96 批 B 新建，用户裁决 Q1~Q6，2026-10-11）────────────────
    # heartbeat-interval：作业心跳间隔（分片边界续期，生产口径不含 demo 装饰节拍）。
    #   依据 = 业界依据 §12「心跳 30–60s」下沿（K8s 缺省 periodSeconds 10s ×
    #   failureThreshold 3 ≈ 30s 同量级；裁决 Q4 取 30s ⇒ 判死窗 90s）。
    # watchdog.scan-period：看门狗扫描周期 10s（业界依据 §12 的「1 分钟扫表」对本项目
    #   极小表规模偏保守）；判死最坏发现延迟 = 判死窗 + 一个扫描周期 ≈ 100s，
    #   E2E Wait-Job 窗口 120s = 90s + 10s + 20s 余量由此派生（总账 S-10）。
    # watchdog.dead-multiplier：判死倍数 3 —— K8s failureThreshold 缺省 3 /
    #   TIBCO「约 3.5×心跳」（业界依据 §12；裁决 Q4）。
    # max-execution-time：作业绝对上限 30m —— Hangfire InvisibilityTimeout 官方缺省
    #   30min、§12 推荐 30–60min 下沿（裁决 Q3；demo-batch-delay-ms 装饰节拍不计入）。
    # 启动期 fail-fast（AppProperties#verifyJobWatchdogKeys）：四项必须 > 0 且
    #   heartbeat-interval × dead-multiplier < max-execution-time。
    heartbeat-interval: 30s
    watchdog:
      scan-period: 10s
      dead-multiplier: 3
    max-execution-time: 30m
  file:
    storage-path: ./data/files

logging:
  level:
    com.example.configmgr: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
