server:
  port: 8081
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 120000

spring:
  application:
    name: config-mgr

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/config_mgr_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Redis：AI 会话记忆外置（S4.2 M2）。Memurai 兼容，只用到普通数据结构（LIST/SET/EXPIRE）。
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3s
      lettuce:
        shutdown-timeout: 200ms

  # ── S4.2 AI Runtime：OpenAI 兼容全配置化（DC-01）──────────────────────────
  # 密钥只经环境变量注入，绝不写入版本库；变量名统一 AI_API_KEY，兼容 DEEPSEEK_API_KEY 兜底。
  # Q2：key 为空时后端仍正常启动——模型侧 bean 由 AiModelConfig 条件化装配（无 key 不建 bean，
  #     AI 端点惰性降级 503 AI_UNAVAILABLE），业务 API 与 CI 不依赖 key。
  ai:
    model:
      # 关闭 Spring AI 各类型模型的自动配置：OpenAI 自动配置在 key 为空时 Assert 失败会中断启动
      # （OpenAIAutoConfigurationUtil.resolveConnectionProperties），本项目只需要 ChatModel。
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        # ChatClient 改由 AiModelConfig 从 ChatModel 组装（挂 MessageChatMemoryAdvisor）
        enabled: false
    openai:
      api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        # 注意：DeepSeek 的接口路径是 /chat/completions（无 /v1 前缀），
        # 必须覆盖默认的 /v1/chat/completions，否则请求 404。
        completions-path: /chat/completions
        options:
          model: ${AI_MODEL:deepseek-flash}
          temperature: 0.2
          max-tokens: 4096
          # 让流式最后一块回传 token 用量（done 终帧 usage 的来源）
          stream-usage: true

app:
  ai:
    max-iterations: 12
    session-ttl-minutes: 30
    hitl-timeout-minutes: 5
    thinking-disabled: true
    # ── S4.2 规格 §4 配置项 ──
    session-ttl: 6h
    memory:
      max-messages: 40
    hitl:
      timeout: 120s
    suspend:
      # 挂起专用有界平台线程池（DC-12 禁用虚拟线程；饱和 503 SUSPEND_POOL_SATURATED 见第二棒）
      pool-size: 20
      queue-capacity: 100
    resilience:
      # 双超时/重试阈值待 §13.2 #2 压测裁决，本棒只用总预算兜住单轮墙钟
      total-budget: 10m
  job:
    demo-batch-delay-ms: 300
    batch-size: 100
  file:
    storage-path: ./data/files
  server:
    backend-port: 8081
    frontend-port: 5173

logging:
  level:
    com.example.configmgr: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
