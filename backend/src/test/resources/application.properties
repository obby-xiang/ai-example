# R1-13：单测默认用进程内 runner-active 登记，避免 CI backend job 依赖 Redis 服务。
# 多实例用例通过 @TestPropertySource 显式覆盖为 redis，并用 mock StringRedisTemplate 做共享态。
app.job.runner-active-store=memory

# 多实例 job 接管批：单测默认关闭任务 SSE 的跨实例 pub/sub（memory = 不触碰 Redis），
# 跨实例用例用 FakeTaskEventBus / 直接构造 RedisTaskEventBus 断言传输语义。
app.task.sse.cross-instance-store=memory

# ── 周期任务与倒排录制的确定性（nightly 40219310874：同 SHA 两遍 diff=58）──────────────
# 归因口径：TestmapRecorder 按"测试类墙钟窗口"取 JaCoCo 探针增量（线程无关），而周期线程在
# Spring 上下文缓存后跨测试类续跑 ⇒ 一次 10s/30s 的触达会被记成"当前那个类的依赖"，
# 两个类各得一对不存在的边（AppProperties+JobWatchdog / LeaseService+SessionPurgeRetryRunner /
# KB 四件套），同一 tree 两遍录制就必然抖。事件数与上下文数量成正比（每个上下文各起一套）。
#
# 处置只在测试侧：把周期注册推到测试窗口之外（或直接关掉注册），**不**动判定阈值、
# **不**过滤差异指纹、**不**删用例；同步能力（scan / runOnce / refreshNow / 启动恢复 / 播种）全部保留。
# 生产缺省不变（本文件只在 test classpath，E2E 与打包产物读 src/main/resources）。
#
# 1) 作业看门狗：scheduleWithFixedDelay 的**首拍 = scan-period** ⇒ 1h 在测试窗口内不触发；
#    看门狗的语义由单测直接驱动 JobWatchdog#scan()（JobWatchdog*Test 全部如此）。
app.job.watchdog.scan-period=1h
# 2) 知识库：start() 仍立即 submit 首次建索引（就绪/播种/`source.prepare()` 不动），
#    只把"定时刷新"和"版本号轮询"推到窗口外（两者缺省 10m / 30s）。
app.ai.kb.refresh-interval=1h
app.ai.kb.cache.version-poll-interval=1h
# 3) 会话销毁重试：只关**周期注册**（启动 SCAN 恢复照常执行，runOnce 仍可直接驱动）。
#    这是本批唯一的代码开关，缺省 true = 生产原样。
app.ai.session.purge-retry.periodic-enabled=false
